<title>Ao nuôi ShrimpVet ESG Farm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow column like a pond record card — brackish-water teal band on top, then data sections */
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#14223a; --muted:#5b6a80; --line:#dbe3ee;
  --water:#1d3f74; --water-ink:#eef4fb; --tide:#2f8fd0; --shrimp:#e8762c; --brand:#1d3f74;
  --ok:#1f8a4c; --ok-soft:#e3f3e8; --warn:#b26b00; --warn-soft:#fbf0dc; --bad:#c23a2b; --bad-soft:#fbe5e2;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1522; --card:#162133; --ink:#e4ebf5; --muted:#97a6bd; --line:#26364f;
  --water:#15305a; --water-ink:#e3ecf8; --tide:#5bb3ea; --shrimp:#f08a45; --brand:#c9d9f0;
  --ok:#4cc27c; --ok-soft:#173326; --warn:#e3a33d; --warn-soft:#3a2c12; --bad:#ef6d5e; --bad-soft:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1522; --card:#162133; --ink:#e4ebf5; --muted:#97a6bd; --line:#26364f;
  --water:#15305a; --water-ink:#e3ecf8; --tide:#5bb3ea; --shrimp:#f08a45; --brand:#c9d9f0;
  --ok:#4cc27c; --ok-soft:#173326; --warn:#e3a33d; --warn-soft:#3a2c12; --bad:#ef6d5e; --bad-soft:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.brandbar{background:var(--card);border-bottom:1px solid var(--line)}
.brandbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brandbar img{height:46px;width:auto;border-radius:6px;background:#fff;padding:2px 4px}
.brandbar b{display:block;font-size:15px;letter-spacing:.02em;color:var(--brand);font-weight:800}
.brandbar span{display:block;font-size:12px;color:var(--shrimp);font-weight:600}
.band{background:var(--water);color:var(--water-ink)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .wrap{padding-block:22px 26px}
.farm{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.85}
h1{font-size:44px;line-height:1.05;margin:6px 0 8px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sub{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-weight:600;font-size:12.5px;background:rgba(255,255,255,.14);color:var(--water-ink)}
.pill i{width:8px;height:8px;border-radius:50%;background:#7fe0a8;display:inline-block}
.pill.off i{background:#c9d6d2}
main.wrap{padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
.intro{color:var(--muted);font-size:14px;margin:0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hist{display:grid;gap:12px}
.hs{margin-bottom:6px}.ht tr.cur td{background:var(--ok-soft)}.ht th,.ht td{padding:7px 5px;font-size:13px}.ht td small{color:var(--muted);font-size:11px}.h3{font-size:14px;margin:16px 0 8px}
.more{margin-top:12px}.more summary{cursor:pointer;font-weight:600;color:var(--tide);font-size:14px;padding:6px 0}.more .hist{margin-top:8px}
.chart .vl{font-size:10px;font-weight:700;fill:currentColor}
.cyc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.cyc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.cyc .top b{font-size:15px}.cyc .top small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.cm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.cm div{min-width:0}.cm span{display:block;font-size:11.5px;color:var(--muted)}
.cm b{font-size:16px;font-variant-numeric:tabular-nums}
.cyc ul{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.hsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0 0 12px}.hsum b{color:var(--ink,inherit)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.stat small{color:var(--muted);font-size:12px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h2{font-size:16px;margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-weight:500;color:var(--muted);font-size:12.5px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}td.wrap{white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}
.wq{display:flex;flex-direction:column;gap:6px}
.wqr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--ok-soft)}
.wqr.out{background:var(--warn-soft)}
.wqr b{font-size:15px;font-variant-numeric:tabular-nums}.wqr span{font-size:13.5px;font-weight:600}
.wqr small{grid-column:1/-1;color:var(--muted);font-size:12px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
ul.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);font-size:14px;margin:0}
.others{display:flex;flex-wrap:wrap;gap:6px}
.others a{font-size:13px;font-weight:600;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--card);font-variant-numeric:tabular-nums}
.others a.cur{background:var(--water);color:var(--water-ink);border-color:var(--water)}
.others a:focus-visible,a:focus-visible{outline:2px solid var(--tide);outline-offset:2px}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding-block:4px 10px}
</style>

function lineChart(pts){ // pts [{x:doc,y:w}]
  const W=420,H=210,L=34,R=14,T=22,B=26;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=5;x1+=5}
  const y1=Math.ceil(Math.max(...ys)*1.15+.5),y0=0;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  const step=y1<=6?1:y1<=12?2:y1<=25?5:10;let g="";
  for(let v=0;v<=y1;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+` L${X(pts[pts.length-1].x).toFixed(1)} ${Y(0)} L${X(pts[0].x).toFixed(1)} ${Y(0)} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?"var(--shrimp)":"var(--tide)"}"/><text x="${X(p.x)}" y="${H-10}" text-anchor="middle">${p.x}</text>`).join("");
  const last=pts[pts.length-1];
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trọng lượng tôm theo ngày nuôi">${g}<path d="${area}" fill="var(--tide)" fill-opacity=".12"/><path d="${path}" fill="none" stroke="var(--tide)" stroke-width="2.5"/>${dots}<text x="${X(last.x)-8}" y="${Y(last.y)-10}" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:13px">${nf(last.y)} g</text></svg>`}
function barChart(rows){
  const W=420,H=200,L=34,R=8,T=22,B=26;const mx=Math.max(...rows.map(r=>r.kg),1);const top=Math.ceil(mx*1.15/10)*10;
  const bw=(W-L-R)/rows.length;const Y=v=>T+(1-v/top)*(H-T-B);let g="";
  const step=top<=40?10:top<=100?20:top<=250?50:100;
  for(let v=0;v<=top;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=rows.map((r,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;return`<rect x="${x}" y="${Y(r.kg)}" width="${w}" height="${Y(0)-Y(r.kg)}" rx="4" fill="${i===rows.length-1?"var(--shrimp)":"var(--tide)"}" fill-opacity="${r.rain?.45:1}"/><text x="${x+w/2}" y="${Y(r.kg)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${nf(r.kg)}</text><text x="${x+w/2}" y="${H-10}" text-anchor="middle">${vs(r.d)}</text>`}).join("");
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lượng thức ăn 7 ngày gần nhất">${g}${bars}</svg>`}

function histCard(p){const f2=v=>Number(v).toLocaleString("vi-VN",{minimumFractionDigits:2,maximumFractionDigits:2});const H=p.history||[];if(!H.length)return"";
  const RS={harvest:["ok","Thu hoạch"],early:["warn","Thu sớm"],cancel:["bad","Huỷ ao"],end:["warn","Kết thúc"]};
  const HT={final:"Thu toàn bộ",partial:"Thu tỉa",transfer:"San tôm"};
  const card=c=>{const r=RS[c.result]||RS.end;
   return`<div class="cyc"><div class="top"><div><b>Vụ ${c.no}</b><small>${vn(c.stockDate)} → ${vn(c.endDate)} · ${c.days} ngày nuôi</small></div><span class="tag ${r[0]}">${r[1]}</span></div>
   <div class="cm"><div><span>Thả</span><b>${nf(c.count,0)}</b><span>${esc(c.seed||"")}</span></div>
   <div><span>Sản lượng thu</span><b>${c.kg?nf(c.kg,0)+" kg":"–"}</b>${c.size?`<span>size ${nf(c.size,0)} con/kg</span>`:""}</div>
   <div><span>Tỷ lệ sống</span><b>${c.surv!=null?nf(c.surv,1)+"%":"–"}</b></div>
   <div><span>FCR</span><b>${c.fcr!=null?f2(c.fcr):"–"}</b></div>
   <div><span>Tổng thức ăn</span><b>${nf(c.feed,0)} kg</b></div>
   <div><span>Trọng lượng thu</span><b>${c.size?nf(1000/c.size,1)+" g":"–"}</b></div></div>
   ${c.harvests.length>1?`<ul>${c.harvests.map(x=>`<li>${vn(x.d)} · ${HT[x.type]||x.type}${x.to?" sang ao "+esc(x.to):""}: ${nf(x.kg,0)} kg${x.size?", size "+nf(x.size,0)+" con/kg":""}</li>`).join("")}</ul>`:""}</div>`};
  const note=`<p class="note">FCR = tổng thức ăn ÷ tổng sản lượng thu (gồm thu tỉa, san tôm). Tỷ lệ sống = số con thu (kg × size) ÷ số con thả.</p>`;
  if(H.length<3)return`<section class="card"><h2>Lịch sử các vụ nuôi <small>vụ đã kết thúc</small></h2><div class="hist">${H.map(card).join("")}</div>${note}</section>`;
  const f=H.filter(c=>c.fcr!=null),sv=H.filter(c=>c.surv!=null),ok=H.filter(c=>c.result!=="cancel");
  const fcrAvg=f.length?f.reduce((a,c)=>a+c.feed,0)/f.reduce((a,c)=>a+c.kg,0):null,svAvg=sv.length?sv.reduce((a,c)=>a+c.surv,0)/sv.length:null;
  const best=f.length?f.reduce((a,c)=>c.fcr<a.fcr?c:a):null;
  // chart: survival bars by vụ (oldest -> newest), FCR label on top
  const A=[...H].reverse(),W=340,Hh=170,pl=36,pb=22,pt=26,bw=(W-pl-6)/A.length;
  let g="";[0,50,100].forEach(v=>{const y=Hh-pb-(Hh-pb-pt)*v/100;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-5}" y="${y+4}" text-anchor="end">${v}%</text>`});
  const bars=A.map((c,i)=>{const x=pl+i*bw+bw*0.18,w=bw*0.64,v=c.surv||0,h=(Hh-pb-pt)*v/100,y=Hh-pb-h;const col=c.result==="cancel"?"var(--bad)":c.result==="early"?"var(--warn)":"var(--tide)";
   return`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1.5)}" rx="3" fill="${col}"/><text x="${x+w/2}" y="${y-5}" text-anchor="middle" class="vl">${c.fcr!=null?f2(c.fcr):"–"}</text><text x="${x+w/2}" y="${Hh-6}" text-anchor="middle">V${c.no}</text>`}).join("");
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Tỷ lệ sống và FCR theo vụ">${g}${bars}</svg><p class="note">Cột: tỷ lệ sống từng vụ · số trên cột: FCR. Xanh = thu hoạch, cam = thu sớm, đỏ = huỷ ao.</p>`;
  const tbl=`<div class="tbl"><table class="ht"><tr><th>Vụ</th><th>Ngày</th><th>Thu (kg)</th><th>Size</th><th>TLS</th><th>FCR</th></tr>${p.status==="active"?(()=>{const lw=p.weights.length?p.weights[p.weights.length-1]:null;return`<tr class="cur"><td><b>V${H[0].no+1}</b><br><small>đang nuôi</small></td><td>${p.doc}</td><td><span class="tag ok">Đang nuôi</span></td><td>${lw?nf(1000/lw.w,0):"–"}</td><td>–</td><td>–</td></tr>`})():""}${H.map(c=>{const r=RS[c.result]||RS.end;return`<tr><td><b>V${c.no}</b><br><small>${vs(c.endDate)}/${c.endDate.slice(2,4)}</small></td><td>${c.days}</td><td>${c.kg?nf(c.kg,0):`<span class="tag ${r[0]}">${r[1]}</span>`}</td><td>${c.size?nf(c.size,0):"–"}</td><td>${c.surv!=null?nf(c.surv,0)+"%":"–"}</td><td>${c.fcr!=null?f2(c.fcr):"–"}</td></tr>`}).join("")}</table></div>`;
  return`<section class="card"><h2>Lịch sử các vụ nuôi <small>${H.length} vụ đã kết thúc${p.status==="active"?" + vụ hiện tại":""}</small></h2>
   <div class="stats hs"><div class="stat"><span>Số vụ</span><b>${H.length}</b><small>${ok.length} vụ có thu hoạch</small></div>
   <div class="stat"><span>Tỷ lệ sống TB</span><b>${svAvg!=null?nf(svAvg,1)+"%":"–"}</b><small>các vụ có thu</small></div>
   <div class="stat"><span>FCR TB</span><b>${fcrAvg!=null?f2(fcrAvg):"–"}</b><small>tính trên tổng</small></div>
   <div class="stat"><span>FCR tốt nhất</span><b>${best?f2(best.fcr):"–"}</b><small>${best?"vụ "+best.no:""}</small></div></div>
   ${chart}${tbl}
   <h3 class="h3">Vụ gần nhất</h3>${card(H[0])}
   <details class="more"><summary>Xem chi tiết ${H.length-1} vụ trước</summary><div class="hist">${H.slice(1).map(card).join("")}</div></details>${note}</section>`}
function render(){
  const ids=Object.keys(DATA.ponds);let id=decodeURIComponent((location.hash||"").slice(1)).toUpperCase();
  const hd=document.getElementById("hd"),app=document.getElementById("app");
  const others=`<section class="card"><h2>Các ao khác của farm</h2><nav class="others">${ids.map(k=>`<a href="#${k}" class="${k===id?"cur":""}">${k}</a>`).join("")}</nav></section>`;
  const foot=`<footer>ShrimpVet ESG Farm · Minh Phu AquaMekong Co., Ltd · Gành Hào, Cà Mau<br>Số liệu cập nhật ngày ${vn(DATA.updated)}</footer>`;
  if(!DATA.ponds[id]){
    hd.innerHTML=`<div class="farm">Gành Hào · Cà Mau</div><h1>Hồ sơ ao nuôi</h1><div class="sub"><span class="pill"><i></i>${ids.filter(k=>DATA.ponds[k].status==="active").length} ao đang nuôi</span><span>Cập nhật ${vn(DATA.updated)}</span></div>`;
    app.innerHTML=`<p class="intro">Chọn một ao để xem số liệu: tăng trưởng, lượng thức ăn, chất lượng nước và kết quả xét nghiệm.</p>${others}${foot}`;document.title="Ao nuôi ShrimpVet ESG Farm";return}
  const p=DATA.ponds[id];document.title="Ao "+id+" · ShrimpVet ESG Farm";
  hd.innerHTML=`<div class="farm">Gành Hào · Cà Mau</div><h1>Ao ${esc(id)}</h1><div class="sub"><span class="pill ${p.status==="active"?"":"off"}"><i></i>${ST[p.status]}</span><span>Diện tích ${nf(p.area,0)} m²</span><span>Cập nhật ${vn(DATA.updated)}</span></div>`;
  let h=`<p class="intro">Số liệu của ao được ghi nhận hằng ngày trên hệ thống quản lý số của farm: thức ăn, môi trường nước, tăng trưởng và xét nghiệm.</p>`;
  if(p.status!=="active"){h+=`<section class="card"><h2>Vụ nuôi</h2><p class="empty">Ao hiện chưa có tôm. Thông tin vụ nuôi mới sẽ hiện ở đây ngay khi farm thả giống.</p></section>`+histCard(p)+others+foot;app.innerHTML=h;return}
  const lw=p.weights.length?p.weights[p.weights.length-1]:null;const lf=p.feed7.length?p.feed7[p.feed7.length-1]:null;
  h+=`<div class="stats">
   <div class="stat"><span>Ngày nuôi</span><b>${p.doc}</b><small>thả ${vn(p.stockDate)}</small></div>
   <div class="stat"><span>Trọng lượng TB</span><b>${lw?nf(lw.w)+" g":"–"}</b><small>${lw?"≈ "+nf(1000/lw.w,0)+" con/kg":"chưa đến lần cân"}</small></div>
   <div class="stat"><span>Thức ăn ngày ${lf?vs(lf.d):""}</span><b>${lf?nf(lf.kg)+" kg":"–"}</b><small>${p.feeds.join(", ")||"–"}</small></div>
   <div class="stat"><span>Tổng thức ăn vụ</span><b>${nf(p.feedTotal,0)} kg</b><small>từ ngày thả</small></div></div>`;
  h+=`<section class="card"><h2>Vụ nuôi hiện tại</h2><dl class="kv">${p.transfer?`<dt>Nguồn tôm</dt><dd>San từ ao khác của farm</dd>`:`<dt>Con giống</dt><dd>${esc(p.seed||"–")}</dd>`}<dt>Số lượng thả</dt><dd>${p.count?nf(p.count,0)+" con":"–"}</dd>${p.density?`<dt>Mật độ</dt><dd>≈ ${nf(p.density,0)} con/m²</dd>`:""}<dt>Thức ăn đang dùng</dt><dd>${esc(p.feeds.join(", ")||"–")}</dd></dl></section>`;
  h+=`<section class="card"><h2>Tăng trưởng <small>trọng lượng TB (g) theo ngày nuôi</small></h2>`;
  if(p.weights.length){h+=lineChart(p.weights.map(w=>({x:w.doc,y:w.w})));
    h+=`<div class="tbl"><table><tr><th>Ngày cân</th><th>Ngày nuôi</th><th>TL TB (g)</th><th>Size (con/kg)</th><th>Tăng (g/ngày)</th></tr>${p.weights.slice().reverse().map((w,i,a)=>{const pv=a[i+1];const adg=pv?(w.w-pv.w)/Math.max((new Date(w.d)-new Date(pv.d))/864e5,1):null;return`<tr><td>${vn(w.d)}</td><td>${w.doc}</td><td>${nf(w.w)}</td><td>${nf(1000/w.w,0)}</td><td>${adg==null?"–":nf(adg,2)}</td></tr>`}).join("")}</table></div><p class="note">Cân mẫu 5 ngày/lần từ ngày nuôi thứ 30.</p>`}
  else h+=`<p class="empty">Tôm được cân mẫu 5 ngày/lần từ ngày nuôi thứ 30. Chưa đến lần cân đầu tiên.</p>`;
  h+=`</section>`;
  if(p.feed7.length){const rain=p.feed7.filter(r=>r.rain);h+=`<section class="card"><h2>Lượng thức ăn <small>7 ngày gần nhất (kg/ngày)</small></h2>${barChart(p.feed7)}<p class="note">Tổng từ đầu vụ đến ${vn(p.feedTo)}: ${nf(p.feedTotal)} kg.${rain.length?` Cột nhạt: ngày giảm ăn do mưa (${rain.map(r=>vs(r.d)).join(", ")}).`:""}</p></section>`}
  if(p.env){const T=DATA.thr;const rows=[["ph","pH","",1],["tan","NH₃/NH₄⁺ (TAN)"," ppm",2],["no2","NO₂"," ppm",2],["alk","Độ kiềm"," mg/L",0],["sal","Độ mặn"," ‰",1]].filter(r=>p.env[r[0]]!=null);
    h+=`<section class="card"><h2>Chất lượng nước <small>lần đo ${vn(p.env.d)}</small></h2><div class="wq">${rows.map(([k,n,u,d])=>{const v=p.env[k],t=T[k]||{};const fmt=k==="ph"?Number(v).toLocaleString("vi-VN",{minimumFractionDigits:1,maximumFractionDigits:1}):null;const out=(t.min!=null&&v<t.min)||(t.max!=null&&v>t.max);const lim=t.min!=null?`Ngưỡng farm: từ ${nf(t.min)}${u}`:t.max!=null?`Ngưỡng farm: dưới ${nf(t.max)}${u}`:"";
      return`<div class="wqr ${out?"out":""}"><span>${n}</span><b>${fmt||nf(v,d)}${u}</b>${lim?`<small>${lim}</small>`:""}</div>`}).join("")}</div></section>`}
  h+=`<section class="card"><h2>Kiểm tra sức khoẻ tôm <small>PCR tại phòng thí nghiệm</small></h2>${p.pcr.length?`<div class="tbl"><table><tr><th>Ngày</th><th>Chỉ tiêu</th><th>Kết quả</th></tr>${p.pcr.map(t=>`<tr><td>${vn(t.d)}</td><td class="wrap">${esc(PCRN[t.target]||t.target)}</td><td><span class="tag ${t.result==="neg"?"ok":t.result==="pos"?"bad":"warn"}">${t.result==="neg"?"Không phát hiện":t.result==="pos"?"Phát hiện":"Nghi ngờ"}</span></td></tr>`).join("")}</table></div><p class="note">Phương pháp: Real-time PCR · ShrimpVet Lab.</p>`:`<p class="empty">Tôm được xét nghiệm PCR định kỳ. Kết quả của vụ này sẽ hiện ở đây.</p>`}</section>`;
  h+=histCard(p);
  h+=`<section class="card"><h2>Cách farm quản lý ao</h2><ul class="how"><li>Ghi nhật ký thức ăn và xử lý ao mỗi ngày</li><li>Đo môi trường nước định kỳ (pH, NH₃, NO₂, kiềm, độ mặn)</li><li>Cân tôm 5 ngày/lần, theo dõi tăng trưởng và sinh khối</li><li>Xét nghiệm PCR và Vibrio định kỳ tại phòng thí nghiệm</li><li>Theo dõi tồn kho thức ăn, vật tư trên cùng hệ thống</li></ul></section>`;
  app.innerHTML=h+others+foot}
render();addEventListener("hashchange",()=>{render();scrollTo(0,0)});
</script>

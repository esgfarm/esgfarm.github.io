<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG Farm – Nhập liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3faf8;--sf:#fff;--sunk:#e9f5f2;--ink:#12343a;--mut:#4f6b6f;--line:#d6ebe6;--ac:#0a8a93;--acs:#dcf4f0;--side:#ffffff;--green:#2a9d5c;
--ok:#23874f;--oks:#dcf3e5;--warn:#a96a06;--warns:#fbefd6;--bad:#c03a26;--bads:#fbe3de;--r:10px;
font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header.top{background:#fff;color:var(--ink);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
header .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:17px;color:var(--ac)}header small{display:block;color:var(--mut);font-size:12.5px}
header .acts-h{display:flex;gap:8px;align-items:center}
header button,header a.home{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ac);border:1.5px solid var(--ac);border-radius:9px;padding:7px 12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
header a.home{background:var(--ac);color:#fff}
header [hidden]{display:none!important}
header button:hover{background:var(--acs)}header a.home:hover{background:#0b6870}
.brandbox{display:none}
@media (max-width:520px){header .lg{display:none}header a.home span{display:none}header b{font-size:15px}header small{font-size:11.5px}}
nav.tabs{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:4}
nav.tabs .in{max-width:1100px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--mut);padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
@media (min-width:1000px){
  body.side{padding-left:228px}
  body.side header.top .in,body.side .wrap{max-width:1180px}
  body.side nav.tabs{position:fixed;left:0;top:0;bottom:0;width:228px;background:linear-gradient(180deg,#ffffff 0%,#effaf7 100%);border:0;border-right:1px solid var(--line);z-index:8;display:flex;flex-direction:column}
  body.side nav.tabs .brandbox{display:block;padding:18px 18px 14px;border-bottom:1px solid var(--line);text-decoration:none}
  body.side nav.tabs .brandbox b{display:block;color:var(--ac);font-size:17px;font-weight:800;letter-spacing:-.01em}
  body.side nav.tabs .brandbox span{display:block;color:var(--green);font-size:12.5px;font-weight:600}
  body.side nav.tabs .in{flex-direction:column;gap:2px;padding:12px 10px;overflow-y:auto;flex:1;margin:0}
  body.side nav.tabs button{color:var(--mut);border:0;border-radius:9px;padding:10px 12px;gap:10px}
  body.side nav.tabs button:hover{background:var(--acs);color:var(--ac)}
  body.side nav.tabs button.on{background:linear-gradient(135deg,var(--ac),#14a3a0);color:#fff;box-shadow:0 6px 14px -8px rgba(10,138,147,.7)}
  body.side nav.tabs .backhome{display:flex;align-items:center;gap:8px;margin:10px;padding:10px 12px;border-radius:9px;color:var(--ac);font-weight:600;font-size:14px;text-decoration:none;border:1.5px solid var(--line)}
  body.side nav.tabs .backhome:hover{border-color:var(--ac);background:#fff}
  body.side header.top .who-brand{display:none}
}
@media (max-width:700px){
  body.side{padding-bottom:64px}
  body.side nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;border-top:1px solid var(--line);border-bottom:0;z-index:8;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.side nav.tabs .in{padding:0 4px;justify-content:flex-start;gap:0;overflow-x:auto;scrollbar-width:none}
  body.side nav.tabs .in::-webkit-scrollbar{display:none}
  body.side nav.tabs button{flex:0 0 72px;min-width:0;flex-direction:column;gap:2px;font-size:10px;padding:7px 0 6px;border-bottom:0;border-top:3px solid transparent;white-space:nowrap;overflow:hidden}
  body.side nav.tabs button.on{border-top-color:var(--ac)}
  body.side nav.tabs .ic{width:20px;height:20px}
  body.side nav.tabs button.on{color:var(--ac)}
}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:15px;margin:16px 0 8px}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.mut{color:var(--mut)}.small{font-size:12.5px}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.banner{padding:10px 12px;border-radius:var(--r);background:var(--warns);margin:10px 0}
.banner.err{background:var(--bads)}.banner.okb{background:var(--oks)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pond{background:var(--sf);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pond:hover{border-color:var(--ac)}.pond b{font-size:19px}
.pond.on{border-left-color:var(--ok)}.pond.alert{border-left-color:var(--bad);background:var(--bads)}.pond.todo{border-left-color:var(--warn)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--mut)}
.chip.g{background:var(--oks);color:var(--ok)}.chip.b{background:var(--acs);color:var(--ac)}.chip.r{background:var(--bads);color:var(--bad)}.chip.y{background:var(--warns);color:var(--warn)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;margin-bottom:8px;align-items:center}
.pc-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:10px}
.pc-count{font-size:13.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:#fff4dc;color:#8a5a00;border:1px solid #f0c36a}
.pc-count.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pchk{position:relative;display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;margin:0;transition:all .12s}
.pchk:hover{border-color:#9fd3cf}
.pchk input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pc-box{width:22px;height:22px;border-radius:6px;border:2px solid #9bb0b4;flex:none;display:grid;place-items:center;background:#fff;margin-top:1px}
.pc-t b{display:block;font-size:16px;color:var(--ink)}.pc-t small{display:block;font-size:11.5px;color:var(--mut);line-height:1.3}
.pchk:has(input:checked){border-color:var(--ac);background:#e3f6f3;box-shadow:0 0 0 3px rgba(10,138,147,.15)}
.pchk:has(input:checked) .pc-box{background:var(--ac);border-color:var(--ac)}
.pchk:has(input:checked) .pc-box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pchk:has(input:checked) .pc-t b{color:var(--ac)}
.pchk:has(input:focus-visible){outline:3px solid #9fd3cf;outline-offset:2px}
.qtrow{grid-template-columns:minmax(0,1fr) 140px 40px;max-width:640px}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--bad)}.btn.s{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:var(--sunk);color:var(--mut);border-radius:8px;height:40px;font-size:18px;cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--sunk);font-size:12.5px;color:var(--mut)}td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td select{min-width:150px;padding:6px 8px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.kp div{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kp b{display:block;font-size:20px}.kp span{font-size:12.5px;color:var(--mut)}
.login{max-width:420px;margin:60px auto;text-align:center}
.login .panel{padding:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
/* icon + tổng quan */
.ts{display:none}.backhome{display:none}
@media (max-width:700px){body.side nav.tabs .tl{display:none}body.side nav.tabs .ts{display:inline}}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
nav.tabs button{display:flex;gap:6px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;font:inherit;color:inherit;cursor:pointer}
.kpi:hover{border-color:var(--ac)}
.kpi .ki{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--acs);color:var(--ac)}
.kpi .ki.r{background:var(--bads);color:var(--bad)}.kpi .ki.y{background:var(--warns);color:var(--warn)}.kpi .ki.g{background:var(--oks);color:var(--ok)}
.kpi .ki .ic{width:22px;height:22px}
.kpi span{display:block;font-size:12.5px;color:var(--mut)}.kpi b{display:block;font-size:20px;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mut)}
/* tổng quan: dải cảnh báo + thẻ trạng thái + thẻ số liệu có màu riêng */
.alertbar{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,#d93b24,#b8261a);color:#fff;border-radius:14px;padding:14px 16px;margin:6px 0 12px;box-shadow:0 10px 24px -14px rgba(185,38,26,.9)}
.alertbar .ai{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.alertbar .ai .ic{width:22px;height:22px}
.alertbar b{display:block;font-size:16px;margin-bottom:6px}
.alertbar .its{display:flex;flex-wrap:wrap;gap:6px}
.alertbar button{border:0;background:#fff;color:#a3221a;font:inherit;font-weight:700;font-size:13px;border-radius:99px;padding:4px 11px;cursor:pointer}
.alertbar button:hover{background:#ffe9e4}
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 12px}
.st{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;cursor:pointer;border-radius:14px;padding:14px 16px;border:1.5px solid}
.st .si{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.st .si .ic{width:24px;height:24px}
.st span{display:block;font-size:13px;font-weight:600}
.st b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.st small{display:block;font-size:12.5px;opacity:.9}
.st.r{background:linear-gradient(135deg,#e2432b,#bf2a1c);border-color:#bf2a1c;color:#fff}.st.r .si{background:rgba(255,255,255,.2);color:#fff}
.st.y{background:#fff4dc;border-color:#f0c36a;color:#7a4b00}.st.y .si{background:#ffd98a;color:#7a4b00}
.st.g{background:#e6f6ec;border-color:#a9dcbc;color:#1d6b40}.st.g .si{background:#c3ead2;color:#1d6b40}
.st:hover{filter:brightness(.98);transform:translateY(-1px)}
@media (max-width:820px){.status{grid-template-columns:1fr}}
@media (max-width:560px){.kpis.metric{grid-template-columns:repeat(2,minmax(0,1fr))}.status{gap:8px}.st{padding:10px 12px}.st .si{width:36px;height:36px}.st b{font-size:19px}.alertbar{padding:12px}}
.kpis.metric{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.kpis.metric .kpi{border-top:4px solid var(--c);}
.kpis.metric .kpi .ki{background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.kpis.metric .kpi b{color:color-mix(in srgb,var(--c) 75%,#12343a)}
.kpis.metric .kpi:hover{border-color:var(--c);border-top-color:var(--c)}
.ph b.t::before{content:"";display:inline-block;width:5px;height:17px;border-radius:3px;background:var(--c,var(--ac));margin-right:9px;vertical-align:-3px}
.tasks li.r{background:#fff0ec;border-radius:10px;padding:9px 10px;margin-bottom:6px;border:1px solid #f6c7bd}
.tasks li.r button{color:#b0291b}
.tasks li.y{background:#fffaf0;border-radius:10px;padding:9px 10px;margin-bottom:6px;border:1px solid #f6e2b5}
.tasks li.r,.tasks li.y{border-bottom-width:1px}
table.ov tr:nth-child(even) td{background:#f8fcfb}
table.ov tr.al td{background:#fff3f0}
table.ov tr.al td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.chip.rr{background:var(--bad);color:#fff}
.ptabs{display:flex;gap:6px;margin:12px 0 14px;border-bottom:2px solid var(--line)}
.ptabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--mut);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.ptabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.pinfo .kpi .hd{display:flex;align-items:center;gap:10px}
.pinfo .kpi .lbl{font-size:13.5px;color:var(--mut);font-weight:600;line-height:1.25}
.pinfo .kpi .ki{width:38px;height:38px}
.ph b.ti::before{display:none}
.ph b.ti{display:flex;align-items:center;gap:9px}
.ph .hi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.ph .hi .ic{width:18px;height:18px}
.wchips{display:flex;flex-wrap:wrap;gap:8px}
.wchips span{display:flex;flex-direction:column;background:#eef7f5;border:1px solid #d3ebe6;border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--mut);min-width:84px}
.wchips span b{font-size:18px;color:var(--ink)}
.wchips span.bad{background:#fff0ec;border-color:#f3b7aa;color:#b0291b}.wchips span.bad b{color:#b0291b}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
.two.pg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
td.wrap{white-space:normal;min-width:220px}
@media (max-width:900px){.two.pg{grid-template-columns:minmax(0,1fr)}}
.two.pg>.panel{min-width:0}
@media (max-width:560px){.kpis.metric.pinfo{grid-template-columns:repeat(2,minmax(0,1fr))}.pinfo .kpi b{font-size:19px}}
.two .panel{margin:0}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{flex-direction:column;gap:6px;padding:10px}.kpi .ki{width:32px;height:32px}.kpi .ki .ic{width:18px;height:18px}.kpi b{font-size:19px}.chart text{font-size:13px}}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ph b{font-size:15px}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto}
.chart .bar{fill:url(#barg);pointer-events:none}.chart .bar.last{fill:#0b6f77}.chart .bar.part{fill:var(--ac);opacity:.35}
.chart .hit{fill:transparent;cursor:default}.chart .hit:hover+.bar,.chart .bar.hl{opacity:.75}
.chart text{font:11px "Be Vietnam Pro",system-ui,sans-serif;fill:var(--mut)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%)}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks .ti{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.tasks .ti.r{background:var(--bads);color:var(--bad)}.tasks .ti.y{background:var(--warns);color:var(--warn)}.tasks .ti.b{background:var(--acs);color:var(--ac)}
.tasks .ti .ic{width:16px;height:16px}
.tasks button{border:0;background:none;padding:0;font:inherit;color:var(--ac);font-weight:600;cursor:pointer;text-align:left}
.feed{list-style:none;margin:0;padding:0}.feed li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}.feed li:last-child{border-bottom:0}
.feed time{display:block;font-size:12px;color:var(--mut)}
.mapwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.mapwrap svg{display:block;width:100%;min-width:640px;height:auto}
.fm-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.qt input,.qt select{padding:7px 8px;font-size:15px}
.qt td{vertical-align:middle;white-space:nowrap}
.qt input.kg{width:72px;text-align:right}.qt input.pc{width:62px;text-align:right}.qt input.w{width:72px;text-align:right}
.qt select{min-width:180px;max-width:220px}
.qt tr.chg td{background:var(--acs)}
.qt input.bad{border-color:var(--bad);background:var(--bads)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;font:inherit;font-weight:600;font-size:14px;padding:9px 14px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}
@media (max-width:700px){.sticky-save{bottom:64px}.qt select{min-width:120px;max-width:140px}.qt input.kg{width:76px}}
/* ===== Trang đăng nhập ===== */
body.lgmode header.top{display:none}
body.lgmode{background:#eaf6f3}
body.lgmode main.wrap{max-width:none;padding:0;margin:0}
.lgp{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,.9fr);background:#0a5f66 url(../assets/hero.jpg) center/cover no-repeat;position:relative}
.lgp::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.72) 30%,rgba(255,255,255,0) 55%),linear-gradient(0deg,rgba(6,62,66,.55) 0%,rgba(6,62,66,0) 35%)}
.lg-hero{position:relative;display:flex;flex-direction:column;padding:44px 56px 40px;min-height:100vh}
.lg-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.lg-mark{display:block;background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 8px 20px -10px rgba(10,95,102,.55)}.lg-mark img{display:block;height:52px;width:auto}
.lg-brand b{display:block;font-size:24px;font-weight:800;color:#0b4f73;letter-spacing:-.01em}.lg-brand b em{font-style:normal;color:#2a9d5c}
.lg-brand small{display:block;font-size:14px;color:#2b5a6a;font-style:italic}

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updatePassword, reauthenticateWithCredential, EmailAuthProvider, setPersistence, browserLocalPersistence, browserSessionPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ===== Cấu hình ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCnIDii7alui2UuHt4zM3rLcJc7FVkSFFs",
  authDomain: "esgfarm-c6ba0.firebaseapp.com",
  projectId: "esgfarm-c6ba0",
  storageBucket: "esgfarm-c6ba0.firebasestorage.app",
  messagingSenderId: "704614035514",
  appId: "1:704614035514:web:19f29c41eab3e40c768503"
};
// Gmail của Quản lý (luôn có toàn quyền). Phải trùng với email trong firestore.rules.
const OWNER_EMAIL = "hungpham.shrimpvet@gmail.com";
// Tài khoản theo tên đăng nhập: "ninh" được lưu trên Firebase là "ninh@esgfarm.local". Phải trùng với firestore.rules.
const USER_DOMAIN = "esgfarm.local";
const toLoginEmail = u => { u = String(u || "").trim().toLowerCase(); return u.includes("@") ? u : u + "@" + USER_DOMAIN; };
const loginName = e => e && e.endsWith("@" + USER_DOMAIN) ? e.slice(0, -USER_DOMAIN.length - 1) : e;
const slugUser = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9._-]/g, "");

const ROLES = { admin:"Quản lý", kythuat:"Kỹ thuật", ao:"Phụ trách ao", kho:"Thủ kho", ketoan:"Kế toán" };
const GROUPS = { thuc_an:"Thức ăn", vi_sinh:"Vi sinh", khoang:"Khoáng", hoa_chat:"Hóa chất / thuốc", khac:"Khác" };
const WATER = [
  {k:"ph", n:"pH", bad:v=>v<7.5},
  {k:"do", n:"DO (mg/L)", bad:v=>v<5},
  {k:"no2", n:"NO2 (mg/L)", bad:v=>v>2},
  {k:"tan", n:"TAN (mg/L)", bad:v=>v>5},
  {k:"kh", n:"Kiềm (mg/L)", bad:v=>v<89},
  {k:"temp", n:"Nhiệt độ (°C)"},
  {k:"sal", n:"Độ mặn (‰)"},
  {k:"abw", n:"Trọng lượng TB (g/con)"}
];

const HARV_TYPES = { tia:"Thu tỉa", san:"San tôm", het:"Thu toàn bộ" };
const LOG_WINDOW_DAYS = 45;
const LOW_FEED_KG = 200;

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ===== Tiện ích ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 });
const fmt = v => v == null || isNaN(v) ? "–" : nf.format(v);
const money = v => v == null || isNaN(v) ? "–" : nf0.format(v) + " đ";
const num = v => { if (v == null) return NaN; const s = String(v).trim().replace(/\s/g, "").replace(",", "."); return s === "" ? NaN : Number(s); };
const today = () => new Date().toLocaleDateString("sv");
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv"); };
const vnDate = d => d ? d.split("-").reverse().join("/") : "–";
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const POND_IDS = ["A","B","C","D"].flatMap(z => [1,2,3,4,5,6].map(i => z + i));
const defaultArea = p => p === "D6" ? 1520 : /^[AB]/.test(p) ? 2025 : 1600;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

/* ===== Trạng thái ===== */
const S = { user:null, email:"", me:null, users:{}, ponds:{}, cycles:{}, logs:{}, items:{}, moves:[], fin:[], harv:[], tests:[], prices:[], started:false, err:"" };
const UI = { tab:null, pond:null, date:today(), startPond:null, finMonth:today().slice(0,7) };
let unsubs = [];
const isOwner = () => OWNER_EMAIL && S.email === OWNER_EMAIL.toLowerCase();
const role = () => isOwner() ? "admin" : (S.me && S.me.active !== false ? S.me.role : "");
const can = {
  allPonds: () => ["admin","kythuat"].includes(role()),
  pond: p => can.allPonds() || (role()==="ao" && S.ponds[p] && S.ponds[p].owner === S.email),
  kho: () => ["admin","kho"].includes(role()),
  fin: () => ["admin","ketoan"].includes(role()),
  cycle: () => ["admin","kythuat"].includes(role()),
  admin: () => role()==="admin"
};
const userName = e => e === "app-cu" ? "App cũ" : e ? (S.users[e] && S.users[e].name) || e : "–";
const itemName = id => S.items[id] ? S.items[id].name : "(đã xoá)";
const itemUnit = id => S.items[id] ? (S.items[id].unit || "") : "";
const sortedItems = grp => Object.entries(S.items).filter(([,v]) => !grp || (grp==="feed" ? v.group==="thuc_an" : v.group!=="thuc_an")).sort((a,b)=>a[1].name.localeCompare(b[1].name,"vi"));

/* ===== Đăng nhập ===== */
$("#logout").onclick = () => signOut(auth);
$("#chpw").onclick = () => { UI.pw = true; UI.pond = null; rerender(); window.scrollTo(0, 0); };
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  Object.assign(S, { user:u, me:null, started:false, err:"", users:{}, ponds:{}, cycles:{}, logs:{}, items:{}, moves:[], fin:[], harv:[], tests:[], prices:[] });
  $("#logout").hidden = !u; $("#chpw").hidden = true; UI.pw = false; UI.dirty = false;
  if (!u) { renderLogin(); return; }
  S.email = (u.email || "").toLowerCase();
  $("#who").textContent = u.displayName ? u.displayName + " · " + S.email : loginName(S.email);
  document.body.classList.remove("lgmode");
  $("#chpw").hidden = !(u.providerData || []).some(x => x.providerId === "password");
  if (isOwner()) { S.me = { role:"admin", name:u.displayName || "Quản lý", active:true }; startData(); }
  unsubs.push(onSnapshot(doc(db, "users", S.email), s => {
    if (isOwner()) { if (s.exists()) S.me = Object.assign({}, s.data(), { role:"admin", active:true }); }
    else { S.me = s.exists() ? s.data() : null; if (role() && !S.started) startData(); }
    render();
  }, e => { console.warn(e); S.me = isOwner() ? S.me : null; render(); }));
  render();
});

function renderLogin(){

function listen(q, fn){ unsubs.push(onSnapshot(q, fn, e => { console.warn(e); if (e.code === "permission-denied") { S.err = "Không có quyền đọc một phần dữ liệu. Kiểm tra lại luật bảo mật (rules)."; render(); } })); }
// Chỉ tải nhật ký cần dùng để tiết kiệm lượt đọc của gói miễn phí:

let logsUnsub = null, logsFrom = null;
function wantLogsFrom(){
  const r = role(); let from = addDays(today(), ["admin","kythuat"].includes(r) ? -LOG_WINDOW_DAYS : -14);
  if (["admin","kythuat"].includes(r)) Object.values(S.ponds).forEach(p => { const c = p.cycleId && S.cycles[p.cycleId]; if (c && cStart(c) < from) from = cStart(c); });
  return from;
}
function syncLogs(){
  const f = wantLogsFrom(); if (logsFrom && f >= logsFrom) return;
  if (logsUnsub) logsUnsub(); else unsubs.push(() => { if (logsUnsub) logsUnsub(); logsUnsub = null; logsFrom = null; });
  logsFrom = f;
  logsUnsub = onSnapshot(query(collection(db,"logs"), where("date", ">=", f)), s => { S.logs = {}; s.forEach(d => S.logs[d.id] = d.data()); render(); },
    e => { console.warn(e); if (e.code === "permission-denied") { S.err = "Không có quyền đọc nhật ký ao."; render(); } });
}
function startData(){
  S.started = true;
  listen(collection(db,"users"), s => { S.users = {}; s.forEach(d => S.users[d.id] = d.data()); render(); });
  listen(collection(db,"ponds"), s => { S.ponds = {}; s.forEach(d => S.ponds[d.id] = d.data()); syncLogs(); render(); });
  listen(collection(db,"cycles"), s => { S.cycles = {}; s.forEach(d => S.cycles[d.id] = Object.assign({ id:d.id }, d.data())); syncLogs(); render(); });
  listen(collection(db,"stockItems"), s => { S.items = {}; s.forEach(d => S.items[d.id] = d.data()); render(); });
  syncLogs();
  listen(collection(db,"harvests"), s => { S.harv = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  listen(query(collection(db,"stockMoves"), orderBy("date","desc"), limit(300)), s => { S.moves = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  listen(collection(db,"prices"), s => { S.prices = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  listen(collection(db,"tests"), s => { S.tests = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  if (can.fin()) listen(collection(db,"finance"), s => { S.fin = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
}

// Ao tính là cần cho ăn trong ngày nếu đã thả và chưa kết thúc vụ (ngày thu hoạch/kết thúc không tính)
const cStart = c => c.startDate || c.stockDate; // vụ nhận tôm san: tính số liệu từ ngày nhận, DOC vẫn theo ngày thả
function cycleOn(c, d){ return cStart(c) <= d && (!c.endDate || c.endDate > d); }
// Ước tính theo vụ, cùng cách tính với app cũ: tỷ lệ sống ước tính 80–90%
const SURV_LO = 0.8, SURV_HI = 0.9;
function cycleStats(cy){
  const logs = Object.values(S.logs).filter(l => l.pond === cy.pond && l.date >= cStart(cy) && (!cy.endDate || l.date <= cy.endDate));
  const feedCum = logs.reduce((a, l) => a + (l.feedTotal || 0), 0);
  const ab = logs.filter(l => l.water && l.water.abw != null).sort((a, b) => a.date.localeCompare(b.date));
  const a1 = ab.at(-1), a0 = ab.at(-2);
  const adg = a1 && a0 ? (a1.water.abw - a0.water.abw) / daysBetween(a0.date, a1.date) : null;
  const hv = S.harv.filter(h => h.cycleId === cy.id);
  const hKg = hv.reduce((a, h) => a + (h.kg || 0), 0), hCnt = hv.reduce((a, h) => a + (h.kg || 0) * (h.size || 0), 0);
  let bio = null, fcr = null;
  if (a1 && cy.stockCount) {
    const alive = sr => Math.max(0, cy.stockCount * sr - hCnt);
    bio = { lo: alive(SURV_LO) * a1.water.abw / 1000, hi: alive(SURV_HI) * a1.water.abw / 1000 };
    if (feedCum > 0) fcr = { lo: feedCum / (bio.hi + hKg), hi: feedCum / (bio.lo + hKg) };
  }
  const size = a1 && a1.water.abw > 0 ? 1000 / a1.water.abw : null, price = priceForSize(size ? Math.round(size) : null);
  const val = bio && price ? { lo: bio.lo * price, hi: bio.hi * price } : null;
  return { feedCum, a1, adg, bio, fcr, hKg, size, price, val };
}
const rng = (r, d = 0) => { if (!r) return "–"; const f = new Intl.NumberFormat("vi-VN", { minimumFractionDigits:d, maximumFractionDigits:d }); const a = f.format(r.lo), b = f.format(r.hi); return a === b ? a : `${a}–${b}`; };
const tons = kg => kg >= 1000 ? nf.format(Math.round(kg / 100) / 10) + " tấn" : nf0.format(kg) + " kg";

/* Biểu đồ so sánh các ao cùng ngày thả */
const CMP_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100"];
const CMP_TABS = { feed:"Thức ăn (kg/ngày)", abw:"Trọng lượng TB (g)", env:"Môi trường" };
function cmpChart(){
  const groups = {};
  POND_IDS.forEach(p => { const c = activeCycle(p); if (c) (groups[c.stockDate] ||= []).push(p); });
  const gk = Object.keys(groups).sort();
  if (!gk.length) return `<p class="mut">Chưa có ao đang nuôi.</p>`;
  if (!groups[UI.cmpG]) { UI.cmpG = gk.find(k => groups[k].length > 1) || gk[0]; UI.cmpP = null; }
  const all = groups[UI.cmpG];
  if (!UI.cmpP || !UI.cmpP.every(p => all.includes(p))) UI.cmpP = all.slice(0, 4);
  const tab = UI.cmpT || "feed", envK = UI.cmpE || "ph";
  const metric = WATER.find(w => w.k === envK);
  const from = UI.cmpG, to = today(), nd = daysBetween(from, to);
  const ser = UI.cmpP.map((p, i) => {
    const pts = Object.values(S.logs).filter(l => l.pond === p && l.date >= from).map(l => {
      const v = tab === "feed" ? ((l.feedTotal || 0) > 0 ? l.feedTotal : null) : tab === "abw" ? (l.water && l.water.abw) : (l.water && l.water[envK]);
      return v == null ? null : { d:l.date, v };
    }).filter(Boolean).sort((a, b) => a.d.localeCompare(b.d));
    return { p, c: CMP_COLORS[all.indexOf(p) % 4], pts };
  });
  const vals = ser.flatMap(x => x.pts.map(q => q.v));

async function saveMany(d, changes){
  const b = writeBatch(db), delta = {};
  for (const [p, ch] of Object.entries(changes)) {
    const ref = doc(db, "logs", p + "_" + d), snap = await getDoc(ref), old = snap.exists() ? snap.data() : {};
    const feeds = ch.feeds || old.feeds || [], treats = ch.treats || old.treats || [];
    const water = Object.assign({}, old.water || {}); if (ch.water) Object.entries(ch.water).forEach(([k, v]) => { if (v === null) delete water[k]; else water[k] = v; });
    let notes = (old.note || "").split(" · ").filter(Boolean);
    if (ch.noFeed !== undefined) { notes = notes.filter(x => x !== NO_FEED); if (ch.noFeed) notes.push(NO_FEED); }
    if (ch.noteAdd && !notes.includes(ch.noteAdd)) notes.push(ch.noteAdd);
    if (ch.feeds) { (old.feeds || []).forEach(f => delta[f.item] = (delta[f.item] || 0) - (f.kg || 0)); feeds.forEach(f => delta[f.item] = (delta[f.item] || 0) + f.kg); }
    if (ch.treats) { (old.treats || []).forEach(x => delta[x.item] = (delta[x.item] || 0) - (x.qty || 0)); treats.forEach(x => delta[x.item] = (delta[x.item] || 0) + x.qty); }
    b.set(ref, { pond:p, date:d, cycleId: old.cycleId || (S.ponds[p] && S.ponds[p].cycleId) || null, feeds, treats, water, note: notes.join(" · "),
      feedTotal: Math.round(feeds.reduce((a, f) => a + f.kg, 0) * 100) / 100, by:S.email, at:serverTimestamp() });
  }
  Object.entries(delta).forEach(([it, v]) => { if (Math.abs(v) > 1e-9 && S.items[it] && !S.items[it].noStock) b.update(doc(db, "stockItems", it), { qty: increment(-v) }); });
  await b.commit();
}
async function quickSave(btn){

      const feeds = [];

    if (!ps.length) return toast("Chưa chọn ao nào.");
    ps.forEach(p => { const l = S.logs[p + "_" + d] || {}; changes[p] = { noteAdd: note || undefined };
      if (add.length) changes[p].treats = (l.treats || []).filter(x => !add.some(a => a.item === x.item)).concat(add); });

      if (ch) changes[tr.dataset.qw] = { water: w };
    }
  }
  const n = Object.keys(changes).length; if (!n) return toast("Chưa có thay đổi nào để lưu.");

  try {
    await saveMany(d, changes);
    toast(`Đã lưu ${n} ao ngày ${vnDate(d)}.`); UI.dirty = false;

/* Thông tin ao: số liệu tóm tắt, biểu đồ, xét nghiệm, môi trường */
function miniChart(pts, o){
  if (!pts.length) return `<p class="mut small">Chưa có số liệu.</p>`;
  const W = 640, H = 190, L = 44, Rr = 12, T = 14, B = 26, iw = W - L - Rr, ih = H - T - B;
  const max = Math.max(...pts.map(x => x.v)) || 1, nice = (() => { const m = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / m) * m; })();
  const x = i => L + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1)), y = v => T + ih - v / nice * ih;
  const bw = Math.max(2, Math.min(18, iw / pts.length * 0.7));
  const ticks = [0, nice / 2, nice].map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3ecea"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7f7c">${fmt(v)}</text>`).join("");
  const step = Math.max(1, Math.ceil(pts.length / 6));
  const xl = pts.map((p, i) => i % step === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#6b7f7c">${shortDate(p.d)}</text>` : "").join("");
  const marks = o.type === "bar"
    ? pts.map((p, i) => `<rect x="${x(i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, T + ih - y(p.v))}" rx="2" fill="${i === pts.length - 1 ? o.dark : o.color}"><title>${vnDate(p.d)}: ${fmt(p.v)} ${o.unit}</title></rect>`).join("")
    : `<polyline fill="none" stroke="${o.color}" stroke-width="2.5" points="${pts.map((p, i) => x(i) + "," + y(p.v)).join(" ")}"/>` + pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="#fff" stroke="${o.color}" stroke-width="2"><title>${vnDate(p.d)}: ${fmt(p.v)} ${o.unit}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${ticks}${marks}${xl}</svg>`;
}

async function saveLog(btn){
  const p = UI.pond, d = $("#ldate").value;
  if (!d) return toast("Chưa chọn ngày.");
  if (d > today()) return toast("Không nhập cho ngày tương lai.");
  const feeds = [], treats = [];
  for (const r of $$("#frows .row")) { const it = r.querySelector("select").value, v = num(r.querySelector("input").value);
    if (!it && isNaN(v)) continue; if (!it || isNaN(v) || v < 0) return toast("Dòng thức ăn chưa đủ loại hoặc số kg."); feeds.push({ item:it, kg:v }); }
  for (const r of $$("#trows .row")) { const it = r.querySelector("select").value, v = num(r.querySelector("input").value);
    if (!it && isNaN(v)) continue; if (!it || isNaN(v) || v < 0) return toast("Dòng xử lý chưa đủ sản phẩm hoặc lượng."); treats.push({ item:it, qty:v }); }
  const water = {};
  for (const f of WATER) { const raw = $(`[name=w_${f.k}]`).value; if (raw.trim() === "") continue; const v = num(raw); if (isNaN(v)) return toast(`${f.n} không phải là số.`); water[f.k] = v; }
  let note = $("#lnote").value.trim();
  const noFeed = $("#nofeed").checked;
  if (noFeed && feeds.length) return toast("Đã chọn “không cho ăn” nhưng vẫn có dòng thức ăn.");
  note = note.split(" · ").filter(x => x && x !== NO_FEED).join(" · ");
  if (noFeed) note = note ? note + " · " + NO_FEED : NO_FEED;
  if (!feeds.length && !treats.length && !Object.keys(water).length && !note) return toast("Chưa có số liệu nào để lưu.");
  btn.disabled = true;
  try {
    const ref = doc(db, "logs", p + "_" + d);
    const oldSnap = await getDoc(ref); const old = oldSnap.exists() ? oldSnap.data() : {};
    const delta = {};
    (old.feeds||[]).forEach(f => delta[f.item] = (delta[f.item]||0) - (f.kg||0));
    (old.treats||[]).forEach(t => delta[t.item] = (delta[t.item]||0) - (t.qty||0));
    feeds.forEach(f => delta[f.item] = (delta[f.item]||0) + f.kg);
    treats.forEach(t => delta[t.item] = (delta[t.item]||0) + t.qty);
    const b = writeBatch(db);
    b.set(ref, { pond:p, date:d, cycleId:(S.ponds[p] && S.ponds[p].cycleId) || null, feeds, treats, water, note,
      feedTotal: feeds.reduce((a,f)=>a+f.kg,0), by:S.email, at:serverTimestamp() });
    Object.entries(delta).forEach(([it, v]) => { if (Math.abs(v) > 1e-9 && S.items[it] && !S.items[it].noStock) b.update(doc(db,"stockItems",it), { qty: increment(-v) }); });
    await b.commit();
    const al = waterAlerts(water);
    toast(al.length ? `Đã lưu. ⚠ Cảnh báo: ${al.join(", ")}` : "Đã lưu số liệu ao " + p);
    rerender();
  } catch (e) { console.error(e); toast(e.code === "permission-denied" ? "Không có quyền nhập cho ao này." : "Lưu không được, kiểm tra mạng rồi thử lại."); }
  finally { btn.disabled = false; }
}

const DEFAULT_SIZES = [20, 30, 40, 50, 60, 70, 80, 90, 100, 120, 150, 200, 250, 300, 350, 400];
const latestPrice = () => S.prices.slice().sort((a, b) => b.date.localeCompare(a.date) || ms0(b.at) - ms0(a.at))[0] || null;

// Giá theo size (con/kg) của bảng giá mới nhất; nằm giữa 2 size thì nội suy; ngoài khoảng bảng giá thì không có giá
function priceForSize(sz){
  const P = latestPrice(); if (!P || !sz) return null;
  const r = (P.rows || []).filter(x => x.price > 0).sort((a, b) => a.size - b.size);
  if (!r.length || sz < r[0].size || sz > r.at(-1).size) return null;
  for (let i = 0; i < r.length; i++) { if (r[i].size === sz) return r[i].price;
    if (r[i].size > sz) { const a = r[i - 1], b = r[i]; return a.price + (b.price - a.price) * (sz - a.size) / (b.size - a.size); } }
  return null;
}

/* ===== Chép dữ liệu app cũ ===== */
function impPlan(D){
  const P = { keyToId:{}, newItems:[], priceUpd:[], base:[], cyc:[], swap:[], setPond:[] };
  const byName = {}; Object.entries(S.items).forEach(([id,v]) => byName[v.name.trim().toLowerCase()] = id);
  for (const it of D.items) {
    const id = byName[it.name.toLowerCase()] || byName[it.old.toLowerCase()] || ("old_" + it.key);
    P.keyToId[it.key] = id;
    if (!S.items[id]) P.newItems.push({ id, it });
    else if (!S.items[id].price && it.price) P.priceUpd.push({ id, price:it.price });
    if (it.oldStock != null) {
      const manual = S.moves.some(m => m.item === id && m.src !== "app-cu");
      const done = S.moves.some(m => m.id === "base_" + id);
      P.base.push({ id, it, cur: S.items[id] ? (S.items[id].qty || 0) : 0, act: done ? "done" : manual ? "skip" : "add" });
    }
  }
  for (const c of D.cycles) {
    if (c.status !== "active") continue;
    const cur = S.ponds[c.pond] && S.ponds[c.pond].cycleId;
    if (cur === c.id) continue;
    if (cur && S.cycles[cur]) P.swap.push({ pond:c.pond, from:cur, fromDate:S.cycles[cur].stockDate, to:c.id, toDate:c.stockDate });
    else P.setPond.push({ pond:c.pond, to:c.id });
  }
  return P;
}
document.addEventListener("change", async e => {
  if (e.target.id !== "impfile" || !e.target.files[0]) return;
  try {
    const D = JSON.parse(await e.target.files[0].text());
    if (D.version !== 1 || !Array.isArray(D.logs)) throw new Error("File không đúng định dạng.");
    const ex = await getDocs(query(collection(db,"logs"), where("date", "<=", D.cutoff)));
    const have = new Set(ex.docs.map(d => d.id));
    const P = impPlan(D);
    const newLogs = D.logs.filter(l => !have.has(l.pond + "_" + l.date));
    UI.imp = { D, P, newLogs };
    const A = { add:"Chuyển tồn sang", skip:"Bỏ qua (thủ kho đã kiểm kê/nhập)", done:"Đã chuyển trước đó" };
    UI.impHtml = `<div class="banner okb" style="margin-top:12px">Dữ liệu app cũ đến hết <b>${vnDate(D.cutoff)}</b>:
      ${D.cycles.length} vụ nuôi (${D.cycles.filter(c=>c.status==="active").length} đang nuôi) ·
      <b>${newLogs.length}</b> ngày nhập liệu${D.logs.length - newLogs.length ? ` (bỏ qua ${D.logs.length - newLogs.length} ngày đã có)` : ""} ·
      ${D.harvests.length} lần thu hoạch · ${D.moves.length} phiếu kho · ${D.finance.length} khoản thu–chi · ${(D.tests||[]).length} kết quả xét nghiệm · ${P.newItems.length} mặt hàng mới.</div>
      ${P.swap.length ? `<div class="banner"><b>Vụ nuôi sẽ được thay theo app cũ:</b><br>${P.swap.map(s => `Ao ${s.pond}: vụ thả ${vnDate(s.fromDate)} (nhập hôm nay) → vụ thả ${vnDate(s.toDate)} (app cũ)`).join("<br>")}<br><span class="small">Người phụ trách ao giữ nguyên; số liệu đã nhập trên trang mới được chuyển sang vụ đúng.</span></div>` : ""}
      ${P.base.length ? `<h3>Tồn kho</h3><div class="tw"><table><tr><th>Hàng</th><th class="r">Tồn app cũ (đến ${vnDate(D.cutoff)})</th><th class="r">Trang mới hiện tại</th><th>Xử lý</th></tr>
        ${P.base.map(b => `<tr><td>${esc(b.it.name)}</td><td class="r num">${fmt(b.it.oldStock)}</td><td class="r num">${fmt(b.cur)}</td><td class="small">${A[b.act]}${b.act==="add" ? ` → ${fmt(b.cur + b.it.oldStock)}` : ""}</td></tr>`).join("")}</table></div>
        <p class="small mut">“Trang mới hiện tại” là số đã bị trừ do nhân viên nhập từ ${vnDate(addDays(D.cutoff,1))}. Chuyển tồn = cộng thêm tồn app cũ.</p>` : ""}
      <div class="acts"><button class="btn p" data-imprun>Chép dữ liệu</button></div>`;
  } catch (er) { console.error(er); UI.impHtml = `<div class="banner err">Không đọc được file: ${esc(er.message || er.code)}</div>`; }
  rerender();
});
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-imprun]"); if (!btn || !UI.imp) return;
  const { D, P, newLogs } = UI.imp; const K = k => P.keyToId[k];
  btn.disabled = true; btn.textContent = "Đang chép…";
  const ops = [];
  P.newItems.forEach(({ id, it }) => ops.push(b => b.set(doc(db,"stockItems",id), { name:it.name, group:it.group, unit:it.unit, qty:0, price:it.price || null })));
  P.priceUpd.forEach(({ id, price }) => ops.push(b => b.update(doc(db,"stockItems",id), { price })));
  D.cycles.forEach(c => ops.push(b => b.set(doc(db,"cycles",c.id), { pond:c.pond, stockDate:c.stockDate, stockCount:c.stockCount, status:c.status, endDate:c.endDate || null, note:c.note || "", seedPrice:c.seedPrice || null, by:"app-cu" }, { merge:true })));
  newLogs.forEach(l => ops.push(b => b.set(doc(db,"logs",l.pond + "_" + l.date), { pond:l.pond, date:l.date, cycleId:l.cycleId,
    feeds:l.feeds.map(f => ({ item:K(f.key), kg:f.kg })), treats:l.treats.map(t => ({ item:K(t.key), qty:t.qty })), water:l.water, note:l.note, feedTotal:l.feedTotal, by:"app-cu", src:"app-cu", at:serverTimestamp() })));
  D.harvests.forEach(h => ops.push(b => b.set(doc(db,"harvests",h.id), { pond:h.pond, cycleId:h.cycleId, date:h.date, type:h.type, kg:h.kg, size:h.size ?? null, price:h.price ?? null, note:h.note, by:"app-cu", at:serverTimestamp() })));
  D.finance.forEach(f => ops.push(b => b.set(doc(db,"finance",f.id), { type:f.type, date:f.date, cat:f.cat, pond:f.pond, amount:f.amount, note:f.note, by:"app-cu", at:serverTimestamp() })));
  (D.tests || []).forEach(({ id, ...t }) => ops.push(b => b.set(doc(db,"tests",id), Object.assign(t, { by:"app-cu", at:serverTimestamp() }))));
  D.moves.forEach(m => ops.push(b => b.set(doc(db,"stockMoves",m.id), { type:m.type, item:K(m.key), qty:m.qty, date:m.date, price:m.price ?? null, note:m.note, by:S.email, src:"app-cu", at:serverTimestamp() })));
  const last = [];
  P.base.filter(x => x.act === "add").forEach(x => {
    last.push(b => b.set(doc(db,"stockMoves","base_" + x.id), { type:"adj", item:x.id, qty:x.it.oldStock, date:D.cutoff, price:null, note:`Tồn chuyển từ app cũ đến hết ${vnDate(D.cutoff)}`, by:S.email, src:"app-cu", at:serverTimestamp() }));
    last.push(b => b.update(doc(db,"stockItems",x.id), { qty:increment(x.it.oldStock) }));
  });
  try {
    for (const s of P.swap) {
      const moved = await getDocs(query(collection(db,"logs"), where("cycleId", "==", s.from)));
      moved.docs.forEach(d => last.push(b => b.update(d.ref, { cycleId:s.to })));
      S.harv.filter(h => h.cycleId === s.from).forEach(h => last.push(b => b.update(doc(db,"harvests",h.id), { cycleId:s.to })));
      last.push(b => b.delete(doc(db,"cycles",s.from)));
      last.push(b => b.update(doc(db,"ponds",s.pond), { cycleId:s.to }));
    }
    P.setPond.forEach(s => last.push(b => S.ponds[s.pond] ? b.update(doc(db,"ponds",s.pond), { cycleId:s.to }) : b.set(doc(db,"ponds",s.pond), { zone:s.pond[0], area:defaultArea(s.pond), owner:null, cycleId:s.to })));
    // Ghi dữ liệu chính theo lô; phần đổi vụ + cộng tồn ghi chung một lô cuối (cùng thành công hoặc cùng không)
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit();
      btn.textContent = `Đang chép… ${Math.min(i + 400, ops.length)}/${ops.length}`;
    }
    if (last.length) { const b = writeBatch(db); last.forEach(f => f(b)); await b.commit(); }
    UI.imp = null; UI.impHtml = `<div class="banner okb" style="margin-top:12px">✓ Đã chép xong: ${newLogs.length} ngày nhập liệu, ${D.cycles.length} vụ, ${D.harvests.length} thu hoạch, ${D.moves.length} phiếu kho, ${D.finance.length} khoản thu–chi, ${(D.tests||[]).length} kết quả xét nghiệm.</div>`;
    toast("Đã chép dữ liệu app cũ."); rerender();
  } catch (er) { console.error(er); UI.imp = null; UI.impHtml = `<div class="banner err" style="margin-top:12px">Chép bị lỗi giữa chừng (${esc(er.code || er.message)}). Anh chọn lại file để chép tiếp, phần đã chép sẽ không bị trùng.</div>`; rerender(); }
});
document.addEventListener("change", async e => {
  const r = e.target.closest("[data-urole]"); if (!r) return;
  try { await updateDoc(doc(db,"users",r.dataset.urole), { role:r.value }); toast("Đã đổi vai trò."); } catch (er) { toast("Không lưu được."); }
  rerender();
});
document.addEventListener("click", async e => {
  if (e.target.closest("[data-usave]")) {
    const em = $("#uemail").value.trim().toLowerCase(), name = $("#uname").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Gmail không hợp lệ.");
    if (!name) return toast("Chưa nhập họ tên.");
    try { await setDoc(doc(db,"users",em), { name, role:$("#urole").value, active:true }, { merge:true }); toast("Đã cấp quyền cho " + name); rerender(); }
    catch (er) { console.error(er); toast("Không lưu được."); }
    return;
  }
  const lk = e.target.closest("[data-ulock]");
  if (lk) { const em = lk.dataset.ulock, u = S.users[em]; const lock = u.active !== false;
    if (lock && !confirm(`Khoá tài khoản ${u.name||em}? Người này sẽ không nhập được nữa.`)) return;
    try { await updateDoc(doc(db,"users",em), { active:!lock }); toast(lock ? "Đã khoá." : "Đã mở khoá."); } catch (er) { toast("Không lưu được."); } return; }
  if (e.target.closest("[data-seed-ponds]")) {
    const b = writeBatch(db); POND_IDS.forEach(p => b.set(doc(db,"ponds",p), { zone:p[0], area:defaultArea(p), owner:null, cycleId:null }, { merge:true }));
    try { await b.commit(); toast("Đã tạo 24 ao."); } catch (er) { console.error(er); toast("Không tạo được."); } return;
  }
  if (e.target.closest("[data-seed-items]")) {
    const feeds = ["HL143 No.1 Hải Đại","HL143 No.4 Hải Đại","AQUA-501.3 Hải Đại","Jade + 3 (Skretting)","Jade + 4 (Skretting)"];
    const b = writeBatch(db); feeds.forEach(n => b.set(doc(collection(db,"stockItems")), { name:n, group:"thuc_an", unit:"kg", qty:0 }));
    try { await b.commit(); toast("Đã tạo danh mục thức ăn. Thủ kho nhập tồn đầu kỳ bằng “Kiểm kê”."); } catch (er) { console.error(er); toast("Không tạo được."); } return;
  }
  if (e.target.closest("[data-export]")) exportExcel(e.target.closest("[data-export]"));
});

function loadXLSX(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => ok(window.XLSX); s.onerror = no; document.head.appendChild(s); }); }
async function exportExcel(btn){
  btn.disabled = true; btn.textContent = "Đang xuất…";
  try {
    const X = await loadXLSX();
    const all = async c => (await getDocs(collection(db, c))).docs.map(d => Object.assign({ id:d.id }, d.data()));
    const [logs, moves, fin, cycles, harv, tests] = await Promise.all(["logs","stockMoves","finance","cycles","harvests","tests"].map(all));
    const wb = X.utils.book_new();
    const add = (name, rows) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length ? rows : [{ "(trống)":"" }]), name);
    add("Nhật ký ao", logs.sort((a,b)=>a.date.localeCompare(b.date)||a.pond.localeCompare(b.pond)).map(l => Object.assign({ "Ngày":vnDate(l.date), "Ao":l.pond,
      "Thức ăn (kg)":l.feedTotal ?? (l.feeds||[]).reduce((a,f)=>a+(f.kg||0),0),
      "Chi tiết thức ăn":(l.feeds||[]).map(f=>`${itemName(f.item)}: ${f.kg}`).join("; "),
      "Xử lý":(l.treats||[]).map(t=>`${itemName(t.item)}: ${t.qty} ${itemUnit(t.item)}`).join("; ") },
      Object.fromEntries(WATER.map(f => [f.n, l.water && l.water[f.k] != null ? l.water[f.k] : ""])), { "Ghi chú":l.note||"", "Người nhập":userName(l.by) })));
    add("Tồn kho", Object.values(S.items).map(v => ({ "Hàng":v.name, "Nhóm":GROUPS[v.group]||"", "Tồn":v.noStock ? "Không lưu kho" : (v.qty||0), "ĐVT":v.unit||"", "Giá nhập gần nhất":v.price||"" })));
    add("Phiếu kho", moves.sort((a,b)=>a.date.localeCompare(b.date)).map(m => ({ "Ngày":vnDate(m.date), "Loại":{in:"Nhập",out:"Xuất",adj:"Kiểm kê"}[m.type]||m.type, "Hàng":itemName(m.item), "Lượng":m.qty, "Đơn giá":m.price||"", "Ghi chú":m.note||"", "Người nhập":userName(m.by) })));
    add("Thu chi", fin.sort((a,b)=>a.date.localeCompare(b.date)).map(f => ({ "Ngày":vnDate(f.date), "Loại":f.type==="thu"?"Thu":"Chi", "Hạng mục":f.cat, "Ao":f.pond||"Chung", "Số tiền":f.amount, "Ghi chú":f.note||"", "Người nhập":userName(f.by) })));
    add("Vụ nuôi", cycles.sort((a,b)=>a.stockDate.localeCompare(b.stockDate)).map(c => ({ "Ao":c.pond, "Ngày thả":vnDate(c.stockDate), "Số con thả":c.stockCount, "Trạng thái":c.status==="done"?"Đã kết thúc":"Đang nuôi", "Ngày kết thúc":vnDate(c.endDate), "Ghi chú":c.note||"" })));
    add("Thu hoạch", harv.sort((a,b)=>a.date.localeCompare(b.date)).map(h => ({ "Ngày":vnDate(h.date), "Ao":h.pond, "Hình thức":HARV_TYPES[h.type]||h.type, "kg":h.kg, "Size":h.size??"", "Ghi chú":h.note||"", "Người nhập":userName(h.by) })));
    add("Xét nghiệm", tests.sort((a,b)=>a.date.localeCompare(b.date)).map(t => ({ "Ngày":vnDate(t.date), "Ao":t.pond, "Loại":t.type==="pcr"?"PCR":"Vibrio", "Mẫu":t.sample||"",
      "Bệnh":t.target||"", "Kết quả PCR":t.type==="pcr"?(PCR_RES[t.result]||t.result):"", "Ct":t.ct??"", "Vibrio vàng":t.type==="vibrio"?vib(t.yellow,t.yLt):"", "Vibrio xanh":t.type==="vibrio"?vib(t.green,t.gLt):"", "Vibrio tổng":t.type==="vibrio"?vib(t.total,t.tLt):"",
      "Số phiếu":t.code||"", "Ghi chú":t.note||"", "Người nhập":userName(t.by) })));
    X.writeFile(wb, `ESGFarm_sao-luu_${today()}.xlsx`);
  } catch (e) { console.error(e); toast("Xuất không được: " + (e.code || e.message)); }
  finally { btn.disabled = false; btn.textContent = "Xuất dữ liệu ra Excel"; }
}
</script>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESG Farm – Nhập liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f1f5fa;--sf:#fff;--sunk:#e8eef6;--ink:#13233a;--mut:#5a6b82;--line:#d8e1ec;--ac:#1f6fd1;--acs:#dde9f9;--side:#0e2a4a;
--ok:#23804f;--oks:#dcf3e5;--warn:#a96a06;--warns:#fbefd6;--bad:#c03a26;--bads:#fbe3de;--r:10px;
font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
header.top{background:var(--side);color:#fff;position:sticky;top:0;z-index:5}
header .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header b{font-size:17px}header small{display:block;color:#c5d3e6;font-size:12.5px}
header button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
nav.tabs{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:4}
nav.tabs .in{max-width:1100px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:0;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--mut);padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:15px;margin:16px 0 8px}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.mut{color:var(--mut)}.small{font-size:12.5px}.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.banner{padding:10px 12px;border-radius:var(--r);background:var(--warns);margin:10px 0}
.banner.err{background:var(--bads)}.banner.okb{background:var(--oks)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pond{background:var(--sf);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.pond:hover{border-color:var(--ac)}.pond b{font-size:19px}
.pond.on{border-left-color:var(--ok)}.pond.alert{border-left-color:var(--bad);background:var(--bads)}.pond.todo{border-left-color:var(--warn)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--mut)}
.chip.g{background:var(--oks);color:var(--ok)}.chip.b{background:var(--acs);color:var(--ac)}.chip.r{background:var(--bads);color:var(--bad)}.chip.y{background:var(--warns);color:var(--warn)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
input,select,textarea{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sf);color:var(--ink);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:64px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:8px;margin-bottom:8px;align-items:center}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--sf);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.d{color:var(--bad)}.btn.s{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:var(--sunk);color:var(--mut);border-radius:8px;height:40px;font-size:18px;cursor:pointer}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--sunk);font-size:12.5px;color:var(--mut)}td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
td select{min-width:150px;padding:6px 8px}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.kp div{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kp b{display:block;font-size:20px}.kp span{font-size:12.5px;color:var(--mut)}
.login{max-width:420px;margin:60px auto;text-align:center}
.login .panel{padding:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.back{border:0;background:none;color:var(--ac);font:inherit;font-weight:600;cursor:pointer;padding:0;margin-bottom:6px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr) 90px 40px}}
</style>
</head>
<body>
<header class="top"><div class="in"><div><b>ESG Farm · Nhập liệu</b><small id="who">Farm Bạc Liêu</small></div><button id="logout" hidden>Đăng xuất</button></div></header>
<nav class="tabs" id="tabs" hidden><div class="in"></div></nav>
<main class="wrap" id="main"><p class="mut">Đang tải…</p></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, getDocs, query, where, orderBy, limit, writeBatch, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== Cấu hình ===== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCnIDii7alui2UuHt4zM3rLcJc7FVkSFFs",
  authDomain: "esgfarm-c6ba0.firebaseapp.com",
  projectId: "esgfarm-c6ba0",
  storageBucket: "esgfarm-c6ba0.firebasestorage.app",
  messagingSenderId: "704614035514",
  appId: "1:704614035514:web:19f29c41eab3e40c768503"
};
// Gmail của Quản lý (luôn có toàn quyền). Phải trùng với email trong firestore.rules.
const OWNER_EMAIL = "hungpham.shrimpvet@gmail.com";

const ROLES = { admin:"Quản lý", kythuat:"Kỹ thuật", ao:"Phụ trách ao", kho:"Thủ kho", ketoan:"Kế toán" };
const GROUPS = { thuc_an:"Thức ăn", vi_sinh:"Vi sinh", khoang:"Khoáng", hoa_chat:"Hóa chất / thuốc", khac:"Khác" };
const WATER = [
  {k:"ph", n:"pH", bad:v=>v<7.5},
  {k:"do", n:"DO (mg/L)", bad:v=>v<5},
  {k:"no2", n:"NO2 (mg/L)", bad:v=>v>2},
  {k:"tan", n:"TAN (mg/L)", bad:v=>v>5},
  {k:"kh", n:"Kiềm (mg/L)", bad:v=>v<89},
  {k:"temp", n:"Nhiệt độ (°C)"},
  {k:"sal", n:"Độ mặn (‰)"},
  {k:"abw", n:"Trọng lượng TB (g/con)"}
];
const FIN_CATS = { chi:["Thức ăn","Con giống","Vi sinh / khoáng / hóa chất","Điện","Nhiên liệu","Lương","Sửa chữa, vật tư","Khác"], thu:["Bán tôm","Khác"] };
const HARV_TYPES = { tia:"Thu tỉa", san:"San tôm", het:"Thu toàn bộ" };
const LOG_WINDOW_DAYS = 45;
const LOW_FEED_KG = 200;

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

/* ===== Tiện ích ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("vi-VN", { maximumFractionDigits: 0 });
const fmt = v => v == null || isNaN(v) ? "–" : nf.format(v);
const money = v => v == null || isNaN(v) ? "–" : nf0.format(v) + " đ";
const num = v => { if (v == null) return NaN; const s = String(v).trim().replace(/\s/g, "").replace(",", "."); return s === "" ? NaN : Number(s); };
const today = () => new Date().toLocaleDateString("sv");
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("sv"); };
const vnDate = d => d ? d.split("-").reverse().join("/") : "–";
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const POND_IDS = ["A","B","C","D"].flatMap(z => [1,2,3,4,5,6].map(i => z + i));
const defaultArea = p => p === "D6" ? 1520 : /^[AB]/.test(p) ? 2025 : 1600;
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3200); }

/* ===== Trạng thái ===== */
const S = { user:null, email:"", me:null, users:{}, ponds:{}, cycles:{}, logs:{}, items:{}, moves:[], fin:[], harv:[], tests:[], started:false, err:"" };
const UI = { tab:null, pond:null, date:today(), startPond:null, finMonth:today().slice(0,7) };
let unsubs = [];
const isOwner = () => OWNER_EMAIL && S.email === OWNER_EMAIL.toLowerCase();
const role = () => isOwner() ? "admin" : (S.me && S.me.active !== false ? S.me.role : "");
const can = {
  allPonds: () => ["admin","kythuat"].includes(role()),
  pond: p => can.allPonds() || (role()==="ao" && S.ponds[p] && S.ponds[p].owner === S.email),
  kho: () => ["admin","kho"].includes(role()),
  fin: () => ["admin","ketoan"].includes(role()),
  cycle: () => ["admin","kythuat"].includes(role()),
  admin: () => role()==="admin"
};
const userName = e => e === "app-cu" ? "App cũ" : e ? (S.users[e] && S.users[e].name) || e : "–";
const itemName = id => S.items[id] ? S.items[id].name : "(đã xoá)";
const itemUnit = id => S.items[id] ? (S.items[id].unit || "") : "";
const sortedItems = grp => Object.entries(S.items).filter(([,v]) => !grp || (grp==="feed" ? v.group==="thuc_an" : v.group!=="thuc_an")).sort((a,b)=>a[1].name.localeCompare(b[1].name,"vi"));

/* ===== Đăng nhập ===== */
$("#logout").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  unsubs.forEach(f => f()); unsubs = [];
  Object.assign(S, { user:u, me:null, started:false, err:"", users:{}, ponds:{}, cycles:{}, logs:{}, items:{}, moves:[], fin:[], harv:[], tests:[] });
  $("#logout").hidden = !u;
  if (!u) { renderLogin(); return; }
  S.email = (u.email || "").toLowerCase();
  $("#who").textContent = u.displayName ? u.displayName + " · " + S.email : S.email;
  if (isOwner()) { S.me = { role:"admin", name:u.displayName || "Quản lý", active:true }; startData(); }
  unsubs.push(onSnapshot(doc(db, "users", S.email), s => {
    if (isOwner()) { if (s.exists()) S.me = Object.assign({}, s.data(), { role:"admin", active:true }); }
    else { S.me = s.exists() ? s.data() : null; if (role() && !S.started) startData(); }
    render();
  }, e => { console.warn(e); S.me = isOwner() ? S.me : null; render(); }));
  render();
});

function renderLogin(){
  $("#tabs").hidden = true;
  $("#main").innerHTML = `<div class="login"><div class="panel">
    <h2>Đăng nhập nhập liệu</h2>
    <p class="mut">Dùng Gmail đã được anh Hùng cấp quyền.</p>
    <button class="btn p" id="gsign" style="width:100%;padding:12px">Đăng nhập bằng Google</button>
    <p class="small mut" style="margin-top:14px">Trang giới thiệu trang trại: <a href="../">esgfarm.github.io</a></p>
  </div></div>`;
  $("#gsign").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) { console.error(e); toast(e.code === "auth/unauthorized-domain" ? "Tên miền chưa được thêm vào Firebase (Authorized domains)." : e.code === "auth/popup-blocked" ? "Trình duyệt chặn cửa sổ đăng nhập, anh cho phép popup rồi thử lại." : "Đăng nhập không được: " + (e.code || e.message)); }
  };
}

/* ===== Tải dữ liệu ===== */
function listen(q, fn){ unsubs.push(onSnapshot(q, fn, e => { console.warn(e); if (e.code === "permission-denied") { S.err = "Không có quyền đọc một phần dữ liệu. Kiểm tra lại luật bảo mật (rules)."; render(); } })); }
function startData(){
  S.started = true;
  listen(collection(db,"users"), s => { S.users = {}; s.forEach(d => S.users[d.id] = d.data()); render(); });
  listen(collection(db,"ponds"), s => { S.ponds = {}; s.forEach(d => S.ponds[d.id] = d.data()); render(); });
  listen(collection(db,"cycles"), s => { S.cycles = {}; s.forEach(d => S.cycles[d.id] = Object.assign({ id:d.id }, d.data())); render(); });
  listen(collection(db,"stockItems"), s => { S.items = {}; s.forEach(d => S.items[d.id] = d.data()); render(); });
  listen(query(collection(db,"logs"), where("date", ">=", addDays(today(), -LOG_WINDOW_DAYS))), s => { S.logs = {}; s.forEach(d => S.logs[d.id] = d.data()); render(); });
  listen(collection(db,"harvests"), s => { S.harv = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  listen(query(collection(db,"stockMoves"), orderBy("date","desc"), limit(300)), s => { S.moves = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  listen(collection(db,"tests"), s => { S.tests = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
  if (can.fin()) listen(collection(db,"finance"), s => { S.fin = s.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); });
}

/* ===== Khung giao diện ===== */
function tabsFor(){
  const r = role(), t = [];
  if (["admin","kythuat","ao"].includes(r)) t.push(["ao","Ao nuôi"]);
  if (["admin","kythuat"].includes(r)) t.push(["vu","Vụ nuôi & phân công"]);
  if (["admin","kythuat"].includes(r)) t.push(["xn","Xét nghiệm"]);
  if (["admin","kho","kythuat"].includes(r)) t.push(["kho","Kho"]);
  if (can.fin()) t.push(["fin","Thu – chi"]);
  if (r === "admin") t.push(["ql","Quản lý"]);
  return t;
}
// Khi đang gõ dở một biểu mẫu, dữ liệu mới từ người khác không vẽ lại trang (tránh mất chữ đang nhập).
UI.dirty = false;
document.addEventListener("input", e => { if (e.target.closest("#main") && e.target.matches("input,textarea")) UI.dirty = true; });
function rerender(){ UI.dirty = false; render(); }

function render(){
  if (!S.user) return;
  if (UI.dirty) return;
  if (!role()) {
    $("#tabs").hidden = true;
    $("#main").innerHTML = `<div class="login"><div class="panel"><h2>Chưa được cấp quyền</h2>
      <p>Email <b>${esc(S.email)}</b> chưa có trong danh sách nhân viên${S.me && S.me.active===false ? " (tài khoản đang bị khoá)" : ""}.</p>
      <p class="mut">Anh nhờ anh Hùng thêm email này ở mục Quản lý, rồi tải lại trang.</p></div></div>`;
    return;
  }
  const tabs = tabsFor();
  if (!tabs.some(t => t[0] === UI.tab)) UI.tab = tabs[0][0];
  const nav = $("#tabs"); nav.hidden = false;
  nav.querySelector(".in").innerHTML = tabs.map(([k,n]) => `<button data-tab="${k}" class="${k===UI.tab?"on":""}">${n}</button>`).join("");
  let h = `<div class="small mut">Vai trò: <b>${ROLES[role()]}</b></div>`;
  if (S.err) h += `<div class="banner err">${esc(S.err)}</div>`;
  h += ({ ao:vAo, vu:vVu, xn:vXn, kho:vKho, fin:vFin, ql:vQl })[UI.tab]();
  $("#main").innerHTML = h;
}
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; UI.tab = b.dataset.tab; UI.pond = null; rerender(); window.scrollTo(0,0); });

/* ===== Ao nuôi ===== */
function activeCycle(p){ const id = S.ponds[p] && S.ponds[p].cycleId; return id && S.cycles[id] ? S.cycles[id] : null; }
function lastWater(p){ const ls = Object.values(S.logs).filter(l => l.pond===p && l.water && Object.keys(l.water).length).sort((a,b)=>b.date.localeCompare(a.date)); return ls[0] || null; }
// Một ngày được tính là "đã nhập lượng ăn" khi có thức ăn hoặc ghi rõ không cho ăn
const NO_FEED = "Không cho ăn";
function fedDay(p, d){ const l = S.logs[p + "_" + d]; return !!l && ((l.feedTotal || 0) > 0 || (l.feeds || []).length > 0 || (l.note || "").includes(NO_FEED)); }
function missingDays(p){
  const cy = activeCycle(p); if (!cy) return [];
  const y = addDays(today(), -1); let d = cy.stockDate > addDays(y, -13) ? cy.stockDate : addDays(y, -13);
  const out = []; for (; d <= y; d = addDays(d, 1)) if (!fedDay(p, d)) out.push(d);
  return out;
}
function lastFed(p){ const ds = Object.values(S.logs).filter(l => l.pond === p && fedDay(p, l.date)).map(l => l.date).sort(); return ds.at(-1) || null; }
const shortDate = d => vnDate(d).slice(0, 5);
function missText(m){ return m.length === 1 ? shortDate(m[0]) : m.length <= 3 ? m.map(shortDate).join(", ") : `${m.length} ngày (${shortDate(m[0])} → ${shortDate(m.at(-1))})`; }
function waterAlerts(w){ return WATER.filter(f => f.bad && w && w[f.k] != null && f.bad(w[f.k])).map(f => f.n.split(" ")[0]); }

function vAo(){
  if (UI.pond) return vPondForm(UI.pond);
  const ids = POND_IDS.concat(Object.keys(S.ponds).filter(p => !POND_IDS.includes(p)).sort());
  const mine = ids.filter(p => S.ponds[p] && (can.allPonds() || S.ponds[p].owner === S.email));
  if (!Object.keys(S.ponds).length) return `<div class="banner">Chưa có danh sách ao. ${can.admin() ? "Anh vào tab <b>Quản lý</b> bấm “Tạo 24 ao”." : "Nhờ anh Hùng tạo danh sách ao."}</div>`;
  if (!mine.length) return `<div class="banner">Anh/chị chưa được giao ao nào. Kỹ thuật sẽ phân ao đầu vụ.</div>`;
  const t = today();
  const card = p => {
    const cy = activeCycle(p), lw = lastWater(p), al = lw ? waterAlerts(lw.water) : [];
    const done = fedDay(p, t), miss = missingDays(p), lf = lastFed(p);
    const cls = al.length ? "alert" : cy && miss.length ? "todo" : cy ? "on" : "";
    return `<button class="pond ${cls}" data-pond="${p}">
      <span style="display:flex;justify-content:space-between;align-items:center"><b>${esc(p)}</b>${cy ? `<span class="chip g">DOC ${daysBetween(cy.stockDate, t)}</span>` : `<span class="chip">Trống</span>`}</span>
      <span class="small mut">${esc(userName(S.ponds[p].owner))}</span>
      ${cy ? `<span class="small mut">Đã nhập đến: <b style="color:var(--ink)">${lf ? shortDate(lf) : "–"}</b></span>
      <span class="small">${miss.length ? `<span class="warn">Thiếu: ${missText(miss)}</span>` : done ? `<span class="ok">✓ Đã nhập hôm nay</span>` : `<span class="ok">✓ Đủ đến hôm qua</span>`}</span>` : `<span class="small">&nbsp;</span>`}
      ${al.length ? `<span class="small bad">⚠ ${esc(al.join(", "))}</span>` : ""}
    </button>`;
  };
  const missAll = {}; mine.forEach(p => missingDays(p).forEach(d => (missAll[d] ||= []).push(p)));
  const mDates = Object.keys(missAll).sort();
  return `<h2>${can.allPonds() ? "Tất cả ao" : "Ao anh/chị phụ trách"}</h2>
    ${mDates.length ? `<div class="banner"><b>Còn thiếu lượng ăn:</b><br>${mDates.map(d => `${vnDate(d)}: ${missAll[d].length === mine.filter(activeCycle).length ? `tất cả ${missAll[d].length} ao` : esc(missAll[d].join(", "))}`).join("<br>")}</div>`

async function saveLog(btn){
  const p = UI.pond, d = $("#ldate").value;
  if (!d) return toast("Chưa chọn ngày.");
  if (d > today()) return toast("Không nhập cho ngày tương lai.");
  const feeds = [], treats = [];
  for (const r of $$("#frows .row")) { const it = r.querySelector("select").value, v = num(r.querySelector("input").value);
    if (!it && isNaN(v)) continue; if (!it || isNaN(v) || v < 0) return toast("Dòng thức ăn chưa đủ loại hoặc số kg."); feeds.push({ item:it, kg:v }); }
  for (const r of $$("#trows .row")) { const it = r.querySelector("select").value, v = num(r.querySelector("input").value);
    if (!it && isNaN(v)) continue; if (!it || isNaN(v) || v < 0) return toast("Dòng xử lý chưa đủ sản phẩm hoặc lượng."); treats.push({ item:it, qty:v }); }
  const water = {};
  for (const f of WATER) { const raw = $(`[name=w_${f.k}]`).value; if (raw.trim() === "") continue; const v = num(raw); if (isNaN(v)) return toast(`${f.n} không phải là số.`); water[f.k] = v; }
  let note = $("#lnote").value.trim();
  const noFeed = $("#nofeed").checked;
  if (noFeed && feeds.length) return toast("Đã chọn “không cho ăn” nhưng vẫn có dòng thức ăn.");
  note = note.split(" · ").filter(x => x && x !== NO_FEED).join(" · ");
  if (noFeed) note = note ? note + " · " + NO_FEED : NO_FEED;
  if (!feeds.length && !treats.length && !Object.keys(water).length && !note) return toast("Chưa có số liệu nào để lưu.");
  btn.disabled = true;
  try {
    const ref = doc(db, "logs", p + "_" + d);
    const oldSnap = await getDoc(ref); const old = oldSnap.exists() ? oldSnap.data() : {};
    const delta = {};
    (old.feeds||[]).forEach(f => delta[f.item] = (delta[f.item]||0) - (f.kg||0));
    (old.treats||[]).forEach(t => delta[t.item] = (delta[t.item]||0) - (t.qty||0));
    feeds.forEach(f => delta[f.item] = (delta[f.item]||0) + f.kg);
    treats.forEach(t => delta[t.item] = (delta[t.item]||0) + t.qty);
    const b = writeBatch(db);
    b.set(ref, { pond:p, date:d, cycleId:(S.ponds[p] && S.ponds[p].cycleId) || null, feeds, treats, water, note,
      feedTotal: feeds.reduce((a,f)=>a+f.kg,0), by:S.email, at:serverTimestamp() });
    Object.entries(delta).forEach(([it, v]) => { if (Math.abs(v) > 1e-9 && S.items[it]) b.update(doc(db,"stockItems",it), { qty: increment(-v) }); });
    await b.commit();
    const al = waterAlerts(water);
    toast(al.length ? `Đã lưu. ⚠ Cảnh báo: ${al.join(", ")}` : "Đã lưu số liệu ao " + p);
    rerender();
  } catch (e) { console.error(e); toast(e.code === "permission-denied" ? "Không có quyền nhập cho ao này." : "Lưu không được, kiểm tra mạng rồi thử lại."); }
  finally { btn.disabled = false; }
}

/* ===== Chép dữ liệu app cũ ===== */
function impPlan(D){
  const P = { keyToId:{}, newItems:[], priceUpd:[], base:[], cyc:[], swap:[], setPond:[] };
  const byName = {}; Object.entries(S.items).forEach(([id,v]) => byName[v.name.trim().toLowerCase()] = id);
  for (const it of D.items) {
    const id = byName[it.name.toLowerCase()] || byName[it.old.toLowerCase()] || ("old_" + it.key);
    P.keyToId[it.key] = id;
    if (!S.items[id]) P.newItems.push({ id, it });
    else if (!S.items[id].price && it.price) P.priceUpd.push({ id, price:it.price });
    if (it.oldStock != null) {
      const manual = S.moves.some(m => m.item === id && m.src !== "app-cu");
      const done = S.moves.some(m => m.id === "base_" + id);
      P.base.push({ id, it, cur: S.items[id] ? (S.items[id].qty || 0) : 0, act: done ? "done" : manual ? "skip" : "add" });
    }
  }
  for (const c of D.cycles) {
    if (c.status !== "active") continue;
    const cur = S.ponds[c.pond] && S.ponds[c.pond].cycleId;
    if (cur === c.id) continue;
    if (cur && S.cycles[cur]) P.swap.push({ pond:c.pond, from:cur, fromDate:S.cycles[cur].stockDate, to:c.id, toDate:c.stockDate });
    else P.setPond.push({ pond:c.pond, to:c.id });
  }
  return P;
}
document.addEventListener("change", async e => {
  if (e.target.id !== "impfile" || !e.target.files[0]) return;
  try {
    const D = JSON.parse(await e.target.files[0].text());
    if (D.version !== 1 || !Array.isArray(D.logs)) throw new Error("File không đúng định dạng.");
    const ex = await getDocs(query(collection(db,"logs"), where("date", "<=", D.cutoff)));
    const have = new Set(ex.docs.map(d => d.id));
    const P = impPlan(D);
    const newLogs = D.logs.filter(l => !have.has(l.pond + "_" + l.date));
    UI.imp = { D, P, newLogs };
    const A = { add:"Chuyển tồn sang", skip:"Bỏ qua (thủ kho đã kiểm kê/nhập)", done:"Đã chuyển trước đó" };
    UI.impHtml = `<div class="banner okb" style="margin-top:12px">Dữ liệu app cũ đến hết <b>${vnDate(D.cutoff)}</b>:
      ${D.cycles.length} vụ nuôi (${D.cycles.filter(c=>c.status==="active").length} đang nuôi) ·
      <b>${newLogs.length}</b> ngày nhập liệu${D.logs.length - newLogs.length ? ` (bỏ qua ${D.logs.length - newLogs.length} ngày đã có)` : ""} ·
      ${D.harvests.length} lần thu hoạch · ${D.moves.length} phiếu kho · ${D.finance.length} khoản thu–chi · ${(D.tests||[]).length} kết quả xét nghiệm · ${P.newItems.length} mặt hàng mới.</div>
      ${P.swap.length ? `<div class="banner"><b>Vụ nuôi sẽ được thay theo app cũ:</b><br>${P.swap.map(s => `Ao ${s.pond}: vụ thả ${vnDate(s.fromDate)} (nhập hôm nay) → vụ thả ${vnDate(s.toDate)} (app cũ)`).join("<br>")}<br><span class="small">Người phụ trách ao giữ nguyên; số liệu đã nhập trên trang mới được chuyển sang vụ đúng.</span></div>` : ""}
      ${P.base.length ? `<h3>Tồn kho</h3><div class="tw"><table><tr><th>Hàng</th><th class="r">Tồn app cũ (đến ${vnDate(D.cutoff)})</th><th class="r">Trang mới hiện tại</th><th>Xử lý</th></tr>
        ${P.base.map(b => `<tr><td>${esc(b.it.name)}</td><td class="r num">${fmt(b.it.oldStock)}</td><td class="r num">${fmt(b.cur)}</td><td class="small">${A[b.act]}${b.act==="add" ? ` → ${fmt(b.cur + b.it.oldStock)}` : ""}</td></tr>`).join("")}</table></div>
        <p class="small mut">“Trang mới hiện tại” là số đã bị trừ do nhân viên nhập từ ${vnDate(addDays(D.cutoff,1))}. Chuyển tồn = cộng thêm tồn app cũ.</p>` : ""}
      <div class="acts"><button class="btn p" data-imprun>Chép dữ liệu</button></div>`;
  } catch (er) { console.error(er); UI.impHtml = `<div class="banner err">Không đọc được file: ${esc(er.message || er.code)}</div>`; }
  rerender();
});
document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-imprun]"); if (!btn || !UI.imp) return;
  const { D, P, newLogs } = UI.imp; const K = k => P.keyToId[k];
  btn.disabled = true; btn.textContent = "Đang chép…";
  const ops = [];
  P.newItems.forEach(({ id, it }) => ops.push(b => b.set(doc(db,"stockItems",id), { name:it.name, group:it.group, unit:it.unit, qty:0, price:it.price || null })));
  P.priceUpd.forEach(({ id, price }) => ops.push(b => b.update(doc(db,"stockItems",id), { price })));
  D.cycles.forEach(c => ops.push(b => b.set(doc(db,"cycles",c.id), { pond:c.pond, stockDate:c.stockDate, stockCount:c.stockCount, status:c.status, endDate:c.endDate || null, note:c.note || "", seedPrice:c.seedPrice || null, by:"app-cu" }, { merge:true })));
  newLogs.forEach(l => ops.push(b => b.set(doc(db,"logs",l.pond + "_" + l.date), { pond:l.pond, date:l.date, cycleId:l.cycleId,
    feeds:l.feeds.map(f => ({ item:K(f.key), kg:f.kg })), treats:l.treats.map(t => ({ item:K(t.key), qty:t.qty })), water:l.water, note:l.note, feedTotal:l.feedTotal, by:"app-cu", src:"app-cu", at:serverTimestamp() })));
  D.harvests.forEach(h => ops.push(b => b.set(doc(db,"harvests",h.id), { pond:h.pond, cycleId:h.cycleId, date:h.date, type:h.type, kg:h.kg, size:h.size ?? null, price:h.price ?? null, note:h.note, by:"app-cu", at:serverTimestamp() })));
  D.finance.forEach(f => ops.push(b => b.set(doc(db,"finance",f.id), { type:f.type, date:f.date, cat:f.cat, pond:f.pond, amount:f.amount, note:f.note, by:"app-cu", at:serverTimestamp() })));
  (D.tests || []).forEach(({ id, ...t }) => ops.push(b => b.set(doc(db,"tests",id), Object.assign(t, { by:"app-cu", at:serverTimestamp() }))));
  D.moves.forEach(m => ops.push(b => b.set(doc(db,"stockMoves",m.id), { type:m.type, item:K(m.key), qty:m.qty, date:m.date, price:m.price ?? null, note:m.note, by:S.email, src:"app-cu", at:serverTimestamp() })));
  const last = [];
  P.base.filter(x => x.act === "add").forEach(x => {
    last.push(b => b.set(doc(db,"stockMoves","base_" + x.id), { type:"adj", item:x.id, qty:x.it.oldStock, date:D.cutoff, price:null, note:`Tồn chuyển từ app cũ đến hết ${vnDate(D.cutoff)}`, by:S.email, src:"app-cu", at:serverTimestamp() }));
    last.push(b => b.update(doc(db,"stockItems",x.id), { qty:increment(x.it.oldStock) }));
  });
  try {
    for (const s of P.swap) {
      const moved = await getDocs(query(collection(db,"logs"), where("cycleId", "==", s.from)));
      moved.docs.forEach(d => last.push(b => b.update(d.ref, { cycleId:s.to })));
      S.harv.filter(h => h.cycleId === s.from).forEach(h => last.push(b => b.update(doc(db,"harvests",h.id), { cycleId:s.to })));
      last.push(b => b.delete(doc(db,"cycles",s.from)));
      last.push(b => b.update(doc(db,"ponds",s.pond), { cycleId:s.to }));
    }
    P.setPond.forEach(s => last.push(b => S.ponds[s.pond] ? b.update(doc(db,"ponds",s.pond), { cycleId:s.to }) : b.set(doc(db,"ponds",s.pond), { zone:s.pond[0], area:defaultArea(s.pond), owner:null, cycleId:s.to })));
    // Ghi dữ liệu chính theo lô; phần đổi vụ + cộng tồn ghi chung một lô cuối (cùng thành công hoặc cùng không)
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit();
      btn.textContent = `Đang chép… ${Math.min(i + 400, ops.length)}/${ops.length}`;
    }
    if (last.length) { const b = writeBatch(db); last.forEach(f => f(b)); await b.commit(); }
    UI.imp = null; UI.impHtml = `<div class="banner okb" style="margin-top:12px">✓ Đã chép xong: ${newLogs.length} ngày nhập liệu, ${D.cycles.length} vụ, ${D.harvests.length} thu hoạch, ${D.moves.length} phiếu kho, ${D.finance.length} khoản thu–chi, ${(D.tests||[]).length} kết quả xét nghiệm.</div>`;
    toast("Đã chép dữ liệu app cũ."); rerender();
  } catch (er) { console.error(er); UI.imp = null; UI.impHtml = `<div class="banner err" style="margin-top:12px">Chép bị lỗi giữa chừng (${esc(er.code || er.message)}). Anh chọn lại file để chép tiếp, phần đã chép sẽ không bị trùng.</div>`; rerender(); }
});
document.addEventListener("change", async e => {
  const r = e.target.closest("[data-urole]"); if (!r) return;
  try { await updateDoc(doc(db,"users",r.dataset.urole), { role:r.value }); toast("Đã đổi vai trò."); } catch (er) { toast("Không lưu được."); }
  rerender();
});
document.addEventListener("click", async e => {
  if (e.target.closest("[data-usave]")) {
    const em = $("#uemail").value.trim().toLowerCase(), name = $("#uname").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast("Gmail không hợp lệ.");
    if (!name) return toast("Chưa nhập họ tên.");
    try { await setDoc(doc(db,"users",em), { name, role:$("#urole").value, active:true }, { merge:true }); toast("Đã cấp quyền cho " + name); rerender(); }
    catch (er) { console.error(er); toast("Không lưu được."); }
    return;
  }
  const lk = e.target.closest("[data-ulock]");
  if (lk) { const em = lk.dataset.ulock, u = S.users[em]; const lock = u.active !== false;
    if (lock && !confirm(`Khoá tài khoản ${u.name||em}? Người này sẽ không nhập được nữa.`)) return;
    try { await updateDoc(doc(db,"users",em), { active:!lock }); toast(lock ? "Đã khoá." : "Đã mở khoá."); } catch (er) { toast("Không lưu được."); } return; }
  if (e.target.closest("[data-seed-ponds]")) {
    const b = writeBatch(db); POND_IDS.forEach(p => b.set(doc(db,"ponds",p), { zone:p[0], area:defaultArea(p), owner:null, cycleId:null }, { merge:true }));
    try { await b.commit(); toast("Đã tạo 24 ao."); } catch (er) { console.error(er); toast("Không tạo được."); } return;
  }
  if (e.target.closest("[data-seed-items]")) {
    const feeds = ["HL143 No.1 Hải Đại","HL143 No.4 Hải Đại","AQUA-501.3 Hải Đại","Jade + 3 (Skretting)","Jade + 4 (Skretting)"];
    const b = writeBatch(db); feeds.forEach(n => b.set(doc(collection(db,"stockItems")), { name:n, group:"thuc_an", unit:"kg", qty:0 }));
    try { await b.commit(); toast("Đã tạo danh mục thức ăn. Thủ kho nhập tồn đầu kỳ bằng “Kiểm kê”."); } catch (er) { console.error(er); toast("Không tạo được."); } return;
  }
  if (e.target.closest("[data-export]")) exportExcel(e.target.closest("[data-export]"));
});

function loadXLSX(){ return window.XLSX ? Promise.resolve(window.XLSX) : new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => ok(window.XLSX); s.onerror = no; document.head.appendChild(s); }); }
async function exportExcel(btn){
  btn.disabled = true; btn.textContent = "Đang xuất…";
  try {
    const X = await loadXLSX();
    const all = async c => (await getDocs(collection(db, c))).docs.map(d => Object.assign({ id:d.id }, d.data()));
    const [logs, moves, fin, cycles, harv, tests] = await Promise.all(["logs","stockMoves","finance","cycles","harvests","tests"].map(all));
    const wb = X.utils.book_new();
    const add = (name, rows) => X.utils.book_append_sheet(wb, X.utils.json_to_sheet(rows.length ? rows : [{ "(trống)":"" }]), name);
    add("Nhật ký ao", logs.sort((a,b)=>a.date.localeCompare(b.date)||a.pond.localeCompare(b.pond)).map(l => Object.assign({ "Ngày":vnDate(l.date), "Ao":l.pond,
      "Thức ăn (kg)":l.feedTotal ?? (l.feeds||[]).reduce((a,f)=>a+(f.kg||0),0),
      "Chi tiết thức ăn":(l.feeds||[]).map(f=>`${itemName(f.item)}: ${f.kg}`).join("; "),
      "Xử lý":(l.treats||[]).map(t=>`${itemName(t.item)}: ${t.qty} ${itemUnit(t.item)}`).join("; ") },
      Object.fromEntries(WATER.map(f => [f.n, l.water && l.water[f.k] != null ? l.water[f.k] : ""])), { "Ghi chú":l.note||"", "Người nhập":userName(l.by) })));
    add("Tồn kho", Object.values(S.items).map(v => ({ "Hàng":v.name, "Nhóm":GROUPS[v.group]||"", "Tồn":v.qty||0, "ĐVT":v.unit||"", "Giá nhập gần nhất":v.price||"" })));
    add("Phiếu kho", moves.sort((a,b)=>a.date.localeCompare(b.date)).map(m => ({ "Ngày":vnDate(m.date), "Loại":{in:"Nhập",out:"Xuất",adj:"Kiểm kê"}[m.type]||m.type, "Hàng":itemName(m.item), "Lượng":m.qty, "Đơn giá":m.price||"", "Ghi chú":m.note||"", "Người nhập":userName(m.by) })));
    add("Thu chi", fin.sort((a,b)=>a.date.localeCompare(b.date)).map(f => ({ "Ngày":vnDate(f.date), "Loại":f.type==="thu"?"Thu":"Chi", "Hạng mục":f.cat, "Ao":f.pond||"Chung", "Số tiền":f.amount, "Ghi chú":f.note||"", "Người nhập":userName(f.by) })));
    add("Vụ nuôi", cycles.sort((a,b)=>a.stockDate.localeCompare(b.stockDate)).map(c => ({ "Ao":c.pond, "Ngày thả":vnDate(c.stockDate), "Số con thả":c.stockCount, "Trạng thái":c.status==="done"?"Đã kết thúc":"Đang nuôi", "Ngày kết thúc":vnDate(c.endDate), "Ghi chú":c.note||"" })));
    add("Thu hoạch", harv.sort((a,b)=>a.date.localeCompare(b.date)).map(h => ({ "Ngày":vnDate(h.date), "Ao":h.pond, "Hình thức":HARV_TYPES[h.type]||h.type, "kg":h.kg, "Size":h.size??"", "Ghi chú":h.note||"", "Người nhập":userName(h.by) })));
    add("Xét nghiệm", tests.sort((a,b)=>a.date.localeCompare(b.date)).map(t => ({ "Ngày":vnDate(t.date), "Ao":t.pond, "Loại":t.type==="pcr"?"PCR":"Vibrio", "Mẫu":t.sample||"",
      "Bệnh":t.target||"", "Kết quả PCR":t.type==="pcr"?(PCR_RES[t.result]||t.result):"", "Ct":t.ct??"", "Vibrio vàng":t.type==="vibrio"?vib(t.yellow,t.yLt):"", "Vibrio xanh":t.type==="vibrio"?vib(t.green,t.gLt):"", "Vibrio tổng":t.type==="vibrio"?vib(t.total,t.tLt):"",
      "Số phiếu":t.code||"", "Ghi chú":t.note||"", "Người nhập":userName(t.by) })));
    X.writeFile(wb, `ESGFarm_sao-luu_${today()}.xlsx`);
  } catch (e) { console.error(e); toast("Xuất không được: " + (e.code || e.message)); }
  finally { btn.disabled = false; btn.textContent = "Xuất dữ liệu ra Excel"; }
}
